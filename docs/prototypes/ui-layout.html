<!doctype html>
<!--
  PROTOTYPE — throwaway. "UI layout prototype" (theholocoder/loom#5), round 2.
  SETTLED (round 3): three panes, Inbox sidebar grouped by Project, Midnight theme with Inter + IBM Plex Mono.
  Alternative themes (Paper, Nord, Mocha, Daylight) are kept. Rounds 1-2 with the losing variants live in the
  history of the prototype/ui-layout branch.
  Round 1 verdict: three-pane layout (A) wins. Round 2 verdict: inbox grouped by Project (B) wins, all themes kept
  (default Midnight), New Session becomes a "+" icon, no Plan/Build toggle, separate UI and monospace fonts
  (monospace for technical refs: issues, MRs, branches, repos, models). This round keeps that layout and explores:
    - the left sidebar as an Inbox, three ways (?variant=A|B|C)
    - a richer composer (agent, model, thinking, mode, attachments, context gauge)
    - a Ctrl+K command palette (actions + session search with is:/project:/has: filters)
    - themes and fonts (?theme=… &font=…), switchable independently from the bottom pill
  All data is mocked in memory; actions are stubs.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loom UI prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Geist:wght@400;500;600;700&family=Atkinson+Hyperlegible:wght@400;700&family=Figtree:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=IBM+Plex+Mono:wght@400;500&family=Geist+Mono:wght@400;500&family=Fira+Code:wght@400;500&family=Source+Code+Pro:wght@400;500&family=Space+Mono&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
  :root {
    --font: Inter, system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace;
    --radius: 8px;
  }
  /* ---- themes ---- */
  [data-theme="midnight"] { --bg:#0f1117; --panel:#161922; --panel2:#1e2230; --hover:#232838; --line:#272c3b; --text:#e6e8ef; --muted:#8a92a6; --accent:#8b9dff; --accent-text:#0f1117;
    --wait:#f2b863; --work:#5fd3f3; --ok:#7ddc8f; --err:#ff7a90; --user:#26304d; --user-line:#34406a; --code:#0b0d12; --sel:#1f2740; --shadow:#000a; }
  [data-theme="paper"] { --bg:#f6f3ec; --panel:#fbf9f4; --panel2:#efebe1; --hover:#ebe6da; --line:#ddd6c6; --text:#2a2823; --muted:#7a7465; --accent:#b4532a; --accent-text:#fff;
    --wait:#b7791f; --work:#2b6cb0; --ok:#2f855a; --err:#c53030; --user:#efe2d2; --user-line:#e0cdb4; --code:#f1ede3; --sel:#f0e3d4; --shadow:#0003; }
  [data-theme="nord"] { --bg:#2e3440; --panel:#323945; --panel2:#3b4252; --hover:#434c5e; --line:#434c5e; --text:#eceff4; --muted:#a3adbf; --accent:#88c0d0; --accent-text:#2e3440;
    --wait:#ebcb8b; --work:#81a1c1; --ok:#a3be8c; --err:#bf616a; --user:#3d4a5f; --user-line:#4c5a72; --code:#272c36; --sel:#3e4a5e; --shadow:#0008; }
  [data-theme="mocha"] { --bg:#1e1e2e; --panel:#232336; --panel2:#2a2a40; --hover:#313149; --line:#363650; --text:#cdd6f4; --muted:#9399b2; --accent:#cba6f7; --accent-text:#1e1e2e;
    --wait:#f9e2af; --work:#89dceb; --ok:#a6e3a1; --err:#f38ba8; --user:#353457; --user-line:#45436e; --code:#181825; --sel:#33334d; --shadow:#000a; }
  [data-theme="daylight"] { --bg:#ffffff; --panel:#f6f8fc; --panel2:#eaf1fb; --hover:#e8eaed; --line:#e3e6ea; --text:#1f1f1f; --muted:#5f6368; --accent:#0b57d0; --accent-text:#fff;
    --wait:#b06000; --work:#0b57d0; --ok:#137333; --err:#b3261e; --user:#d3e3fd; --user-line:#c2d6f8; --code:#f6f8fc; --sel:#d3e3fd; --shadow:#0002; }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.5 var(--font); }
  button, select, input, textarea { font: inherit; color: inherit; }
  button { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  button:hover { background: var(--hover); }
  .icon-btn { background: none; border: 0; width: 30px; height: 30px; padding: 0; justify-content: center; border-radius: 50%; color: var(--muted); }
  .icon-btn:hover { background: var(--hover); color: var(--text); }
  .icon-btn.sm { width: 26px; height: 26px; }
  .primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .primary:hover { background: var(--accent); filter: brightness(1.08); }
  svg.lucide { width: 16px; height: 16px; stroke-width: 2; flex: none; }
  .sm svg.lucide, svg.lucide.sm { width: 14px; height: 14px; }
  code, pre { font-family: var(--mono); font-size: 12.5px; }
  code { background: var(--code); border: 1px solid var(--line); padding: 0 4px; border-radius: 4px; }
  pre { background: var(--code); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; overflow: auto; margin: 8px 0; }
  .muted { color: var(--muted); }
  .row { display: flex; gap: 6px; align-items: center; }
  .grow { flex: 1; min-width: 0; }
  .ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .spin { display: inline-flex; animation: spin 1.4s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .st-waiting-question { color: var(--wait); } .st-waiting-finished { color: var(--ok); } .st-waiting-stuck { color: var(--err); }
  .st-working { color: var(--work); } .st-archived { color: var(--muted); }
  .proj-tag { display: inline-flex; align-items: center; gap: 5px; font-weight: 600; font-size: 12px; padding: 1px 7px 1px 5px; border-radius: 5px; white-space: nowrap; }
  .proj-avatar { display: grid; place-items: center; border-radius: 8px; font-weight: 700; color: #fff; flex: none; }
  .tech { font-family: var(--mono); font-size: .9em; letter-spacing: -.01em; }
  .chip { display: inline-flex; gap: 4px; align-items: center; font-size: 12px; padding: 1px 7px; border-radius: 10px; background: var(--panel2); color: var(--muted); white-space: nowrap; }

  /* ---- layout ---- */
  .app { display: grid; grid-template-columns: 360px 1fr auto; height: 100%; }
  .side { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .side-top { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; }
  .search { display: flex; align-items: center; gap: 8px; background: var(--panel2); border-radius: 22px; padding: 8px 14px; color: var(--muted); cursor: text; }
  .search kbd { margin-left: auto; }
  kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; color: var(--muted); background: var(--panel); }
  .compose { align-self: flex-start; padding: 10px 18px; border-radius: 14px; font-weight: 600; }
  .side-list { flex: 1; overflow: auto; }
  .side-foot { border-top: 1px solid var(--line); padding: 6px 8px; display: flex; gap: 2px; }

  /* inbox rows (shared) */
  .item { position: relative; cursor: pointer; border-bottom: 1px solid var(--line); }
  .item:hover { background: var(--hover); box-shadow: inset 2px 0 0 var(--accent); }
  .item.sel { background: var(--sel); }
  .item .hover-actions { display: none; position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: inherit; gap: 0; }
  .item:hover .hover-actions { display: flex; background: var(--hover); }
  .item:hover .time { visibility: hidden; }
  .unread .title { font-weight: 700; }
  .unread-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; }
  .elapsed { font-family: var(--mono); font-size: 12px; color: var(--work); white-space: nowrap; text-transform: none; letter-spacing: 0; }
  .time { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .unread .time { color: var(--text); font-weight: 600; }
  .snippet { color: var(--muted); font-size: 13px; }

  /* Variant B: grouped by project */
  .B-group-head { display: flex; align-items: center; gap: 8px; padding: 12px 12px 6px; position: sticky; top: 0; background: var(--panel); z-index: 1; }
  .B-group-head b { font-size: 13px; }
  .B-item { padding: 7px 12px 7px 46px; border-bottom: 0; }
  .B-item .l1 { display: flex; align-items: center; gap: 8px; }
  .B-item .l2 { display: flex; gap: 8px; margin-top: 1px; color: var(--muted); font-size: 12px; }
  .section-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; color: var(--muted); cursor: pointer; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; border-top: 1px solid var(--line); }
  .section-head:hover { color: var(--text); }
  .mini { display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 16px; cursor: pointer; font-size: 13px; }
  .mini:hover { background: var(--hover); } .mini.sel { background: var(--sel); }

  /* ---- main ---- */
  .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .main-head { padding: 10px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; }
  .crumb { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
  .main-head h1 { font-size: 16px; margin: 0; font-weight: 650; }
  .meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .chat { flex: 1; overflow: auto; padding: 20px 28px; }
  .msg { display: flex; gap: 12px; margin: 16px 0; }
  .msg.user { justify-content: flex-end; }
  .msg .who { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; flex: none; background: var(--panel2); color: var(--accent); }
  .msg .body { min-width: 0; }
  .msg.agent .body { flex: 1; }
  .msg.user .bubble { max-width: 85%; background: var(--user); border: 1px solid var(--user-line); padding: 8px 14px; border-radius: 16px 16px 4px 16px; }
  .msg.agent .bubble { background: var(--panel); border: 1px solid var(--line); padding: 8px 14px; border-radius: 4px 16px 16px 16px; }
  .bubble p { margin: 6px 0; } .bubble ul { margin: 6px 0; padding-left: 20px; }
  .msg .name { font-size: 12px; color: var(--muted); margin-bottom: 3px; }
  .tools { margin-left: 42px; }
  .tool { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); margin: 6px 0; overflow: hidden; }
  .tool-head { display: flex; gap: 8px; align-items: center; padding: 6px 10px; cursor: pointer; font-size: 13px; }
  .tool-head .name { font-family: var(--mono); font-size: 12px; color: var(--accent); }
  .tool-body { border-top: 1px solid var(--line); padding: 8px 10px; }
  .tool.question { border-color: var(--wait); box-shadow: 0 0 0 3px color-mix(in srgb, var(--wait) 15%, transparent); }
  .tool.question .name { color: var(--wait); }
  .opts { display: flex; gap: 6px; flex-wrap: wrap; }

  /* composer */
  .composer-wrap { padding: 8px 28px 18px; }
  .composer { border: 1px solid var(--line); border-radius: 16px; background: var(--panel); box-shadow: 0 2px 12px var(--shadow); }
  .composer:focus-within { border-color: var(--accent); }
  .attachments { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 12px 0; }
  .att { display: inline-flex; align-items: center; gap: 6px; background: var(--panel2); border-radius: 8px; padding: 4px 6px 4px 8px; font-size: 12px; }
  .composer textarea { width: 100%; border: 0; outline: none; background: none; resize: none; padding: 12px 14px 4px; min-height: 52px; max-height: 200px; }
  .ctoolbar { display: flex; align-items: center; gap: 4px; padding: 6px 8px; }
  .pick { position: relative; display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 8px; color: var(--muted); font-size: 12.5px; cursor: pointer; }
  .pick:hover { background: var(--hover); color: var(--text); }
  .pick select { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .pick b { color: var(--text); font-weight: 500; }
  .sep { width: 1px; height: 18px; background: var(--line); margin: 0 4px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg span { padding: 2px 9px; font-size: 12px; cursor: pointer; color: var(--muted); display: inline-flex; gap: 4px; align-items: center; }
  .seg span.on { background: var(--panel2); color: var(--text); }
  .gauge { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); padding: 0 6px; }
  .send { border-radius: 10px; padding: 6px 12px; }
  .hint { font-size: 11.5px; color: var(--muted); padding: 6px 4px 0; display: flex; gap: 12px; }

  /* diff */
  .diff-rail { width: 44px; border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; align-items: center; padding-top: 12px; gap: 10px; cursor: pointer; color: var(--muted); }
  .diff-rail:hover { color: var(--text); }
  .diff-rail span { writing-mode: vertical-rl; letter-spacing: .12em; font-size: 12px; font-weight: 600; }
  .diff { width: min(44vw, 640px); border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  .diff header { padding: 10px 12px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
  .diff .scroll { flex: 1; overflow: auto; padding: 0 12px; }
  .diff-file { border: 1px solid var(--line); border-radius: 8px; margin: 10px 0; overflow: hidden; }
  .diff-file h4 { margin: 0; padding: 6px 10px; background: var(--panel2); font: 500 12px var(--mono); display: flex; gap: 8px; align-items: center; }
  .diff-line { font: 12px/1.6 var(--mono); white-space: pre; padding: 0 10px; }
  .diff-line.add { background: color-mix(in srgb, var(--ok) 14%, transparent); } .diff-line.del { background: color-mix(in srgb, var(--err) 14%, transparent); }
  .diff-loading { padding: 30px; color: var(--muted); text-align: center; display: flex; gap: 8px; justify-content: center; }

  /* project identity = categorical slots 1-3 (validated per surface, see dataviz validator) */
  [data-theme="midnight"], [data-theme="nord"], [data-theme="mocha"] { --p1:#3987e5; --p2:#d95926; --p3:#199e70; }
  [data-theme="paper"], [data-theme="daylight"] { --p1:#2a78d6; --p2:#eb6834; --p3:#1baf7a; }

  /* dashboard */
  .dash { overflow: auto; padding: 20px 28px 90px; min-width: 0; }
  .dash h1 { font-size: 20px; margin: 0; }
  .dash-filters { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 12px 0 18px; }
  .dash-filters select { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 3px 8px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .tile .k { color: var(--muted); font-size: 12.5px; display: flex; gap: 6px; align-items: center; }
  .tile .v { font-size: 26px; font-weight: 650; letter-spacing: -.02em; margin: 2px 0; font-variant-numeric: tabular-nums; }
  .tile .d { font-size: 12px; color: var(--muted); display: flex; gap: 4px; align-items: center; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; min-width: 0; }
  .card.wide { grid-column: 1 / -1; }
  .card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .card-head h3 { margin: 0; font-size: 14px; font-weight: 600; }
  .legend { display: flex; gap: 14px; font-size: 12.5px; color: var(--muted); }
  .legend span { display: inline-flex; gap: 6px; align-items: center; }
  .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .chart svg { width: 100%; height: auto; display: block; }
  .chart text { fill: var(--muted); font: 8.5px var(--mono); }
  .chart .grid { stroke: var(--line); stroke-width: 1; }
  .chart .hit { fill: transparent; cursor: crosshair; }
  .chart .hit:hover { fill: color-mix(in srgb, var(--text) 6%, transparent); }
  .hbar { display: grid; grid-template-columns: 130px 1fr 64px; gap: 10px; align-items: center; padding: 5px 0; font-size: 13px; }
  .hbar .track { height: 12px; }
  .hbar .fill { height: 100%; border-radius: 0 4px 4px 0; min-width: 2px; }
  .hbar .val { text-align: right; font-family: var(--mono); font-size: 12px; }
  table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.data th { text-align: left; color: var(--muted); font-weight: 500; font-size: 12px; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  table.data td { padding: 7px 8px; border-bottom: 1px solid var(--line); }
  table.data td.n, table.data th.n { text-align: right; font-family: var(--mono); font-size: 12px; }
  table.data tr.click { cursor: pointer; } table.data tr.click:hover td { background: var(--hover); }
  .share { display: flex; height: 10px; border-radius: 5px; overflow: hidden; gap: 2px; margin: 8px 0 6px; }
  #tip { position: fixed; pointer-events: none; z-index: 120; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px var(--shadow); padding: 8px 10px; font-size: 12.5px; display: none; min-width: 160px; }
  #tip .r { display: flex; gap: 8px; align-items: center; } #tip .r b { margin-left: auto; font-family: var(--mono); font-weight: 500; padding-left: 12px; }

  /* palette */
  .overlay { position: fixed; inset: 0; background: color-mix(in srgb, #000 45%, transparent); display: flex; justify-content: center; align-items: flex-start; padding-top: 12vh; z-index: 50; }
  .palette { width: min(640px, 92vw); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 20px 60px var(--shadow); overflow: hidden; }
  .palette .in { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .palette input { flex: 1; border: 0; outline: none; background: none; font-size: 15px; }
  .filters { display: flex; gap: 6px; padding: 8px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .filters .f { font-size: 12px; padding: 2px 8px; border-radius: 10px; border: 1px solid var(--line); cursor: pointer; color: var(--muted); font-family: var(--mono); }
  .filters .f.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .results { max-height: 52vh; overflow: auto; padding: 6px; }
  .grp { padding: 8px 10px 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
  .res { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; cursor: pointer; }
  .res.hi { background: var(--sel); }
  .res kbd { margin-left: auto; }
  .palette footer { display: flex; gap: 14px; padding: 8px 14px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }

  /* switcher pill (not part of the design) */
  #switcher { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); background: #fff; color: #111; border-radius: 999px; box-shadow: 0 6px 24px #0007; display: flex; align-items: center; gap: 8px; padding: 4px 8px; z-index: 100; font: 600 12px system-ui, sans-serif; white-space: nowrap; }
  #switcher button { background: #eee; color: #111; border: 0; border-radius: 50%; width: 26px; height: 26px; padding: 0; justify-content: center; }
  #switcher select { font: 12px system-ui; color: #111; background: #f2f2f2; border: 0; border-radius: 6px; padding: 3px 4px; }
  #switcher .state { font: 11px ui-monospace, monospace; color: #666; padding-left: 8px; border-left: 1px solid #ddd; }
  #toast { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 7px 14px; border-radius: 8px; z-index: 101; display: none; font-size: 13px; }
</style>
</head>
<body>
<div id="root" style="height:100%"></div>
<div id="switcher"></div>
<div id="toast"></div>
<div id="tip"></div>
<script>
// ---------- mock data ----------
const projects = {
  loom: { name: 'loom', forge: 'github', repo: 'theholocoder/loom', color: 'var(--p1)' },
  billing: { name: 'billing-api', forge: 'gitlab', repo: 'acme/billing-api', color: 'var(--p2)' },
  docs: { name: 'docs-site', forge: 'github', repo: 'acme/docs-site', color: 'var(--p3)' },
};
const sessions = [
  { id: 's1', status: 'waiting', reason: 'question', unread: true, title: 'Add Merge request button to Session header', project: 'loom', branch: 'loom/31-mr-button', issue: '#31', mr: null, time: '10:42',
    snippet: 'Should the button open a draft MR by default, or ask every time?' },
  { id: 's2', status: 'waiting', reason: 'finished', unread: true, title: 'Fix flaky worktree cleanup test', project: 'loom', branch: 'loom/28-flaky-cleanup', issue: '#28', mr: '#40', time: '10:35',
    snippet: 'Done. The test now waits for the git lock to be released; 3/3 runs green.' },

}

  for (let i = period - 1; i >= 0; i--) {
    const d = new Date(END); d.setDate(d.getDate() - i);
    const weekend = d.getDay() === 0 || d.getDay() === 6;
    days.push({ label: dayLabel(i), by: Object.fromEntries(projs.map((p, j) => [p, PROJECT_BASE[p] * mult * (weekend ? .12 : .4 + rnd(i + seed, j + 1) * 1.2)])) });
  }
  const byProject = Object.fromEntries(projs.map(p => [p, days.reduce((a, d) => a + d.by[p], 0)]));
  const total = Object.values(byProject).reduce((a, b) => a + b, 0);
  const sessionsN = Math.round(period * .9 * mult * projs.length / 3);
  return { projs, days, byProject, total, sessionsN, mult };
}
function tile(icon, k, v, d) { return `<div class="tile"><div class="k">${ic(icon, 'sm')}${k}</div><div class="v">${v}</div><div class="d">${d}</div></div>`; }
function stackedBars(u) {
  const W = 820, H = 230, L = 46, B = 24, T = 8, n = u.days.length, bw = (W - L) / n, barW = Math.max(2, bw * .68);
  const max = Math.max(...u.days.map(d => u.projs.reduce((a, p) => a + d.by[p], 0))) * 1.08;
  const y = v => T + (H - T - B) * (1 - v / max), base = H - B;
  let g = '';
  for (let t = 0; t <= 3; t++) { const v = max / 3 * t, yy = y(v); g += `<line class="grid" x1="${L}" x2="${W}" y1="${yy}" y2="${yy}"/><text x="${L - 6}" y="${yy + 4}" text-anchor="end">${fmtN(v)}</text>`; }
  const step = Math.ceil(n / 8);
  u.days.forEach((d, i) => {
    const x = L + i * bw + (bw - barW) / 2;
    let acc = 0;
    u.projs.forEach((p, j) => {
      const v = d.by[p], y0 = y(acc), y1 = y(acc + v), top = j === u.projs.length - 1;
      const h = Math.max(0, y0 - y1 - (j ? 2 : 0)); // 2px surface gap between stacked segments
      const yTop = y0 - (j ? 2 : 0) - h, r = top ? Math.min(4, barW / 2, h) : 0;
      g += `<path fill="${projects[p].color}" d="M${x},${yTop + h} V${yTop + r} q0,-${r} ${r},-${r} H${x + barW - r} q${r},0 ${r},${r} V${yTop + h} Z"/>`;
      acc += v;
    });
    if (i % step === n % step || i === n - 1) g += `<text x="${i === n - 1 ? x + barW : x + barW / 2}" y="${H - 8}" text-anchor="${i === n - 1 ? 'end' : 'middle'}">${d.label}</text>`;
    const tip = `<b>${d.label}</b>` + u.projs.map(p => `<div class="r"><span class="sw" style="background:${projects[p].color}"></span>${esc(projects[p].name)}<b>${fmtN(d.by[p])}</b></div>`).join('') + `<div class="r muted">total<b>${fmtN(acc)}</b></div>`;
    g += `<rect class="hit" x="${L + i * bw}" y="${T}" width="${bw}" height="${base - T}" data-tip="${esc(tip)}"/>`;
  });
  g += `<line class="grid" x1="${L}" x2="${W}" y1="${base}" y2="${base}" style="stroke:var(--muted)"/>`;
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Tokens per day by Project">${g}</svg></div>`;
}
function dayTable(u) {
  return `<div style="max-height:260px;overflow:auto"><table class="data"><tr><th>Day</th>${u.projs.map(p => `<th class="n">${esc(projects[p].name)}</th>`).join('')}<th class="n">Total</th></tr>
    ${u.days.slice().reverse().map(d => `<tr><td>${d.label}</td>${u.projs.map(p => `<td class="n">${fmtN(d.by[p])}</td>`).join('')}<td class="n">${fmtN(u.projs.reduce((a, p) => a + d.by[p], 0))}</td></tr>`).join('')}</table></div>`;
}
function hbars(rows, color) {
  const max = Math.max(...rows.map(r => r[1]));
  return rows.map(([label, v, c]) => `<div class="hbar" data-tip="${esc(`<b>${label}</b><div class="r">tokens<b>${fmtN(v)}</b></div>`)}"><span class="ellipsis">${label}</span><div class="track"><div class="fill" style="width:${v / max * 100}%;background:${c || color}"></div></div><span class="val">${fmtN(v)}</span></div>`).join('');
}
function Dashboard() {
  const D = state.dash, u = usage(), team = D.scope === 'team';
  const cost = u.total / 1e6 * 3.1, prev = .88;
  const seg = (k, opts) => `<span class="seg">${opts.map(([v, l]) => `<span class="${String(D[k]) === String(v) ? 'on' : ''}" data-act="dash" data-k="${k}" data-v="${v}">${l}</span>`).join('')}</span>`;
  const top = sessions.filter(s => u.projs.includes(s.project)).map((s, i) => ({ s, tok: (2.4 - i * .21) * 1e6 * (team ? 1 : .6), dur: [72, 41, 133, 18, 55, 27, 64, 22, 39, 12][i % 10] }));
  return `<main class="dash">
    <div class="row"><h1>Dashboard</h1><span class="grow"></span><span class="muted" style="font-size:12px">${team ? 'Reported to the Server by every Client · counts only' : 'Computed from Sessions on this machine'}</span></div>
    <div class="dash-filters">
      ${seg('scope', [['me', `${ic('user-round', 'sm')}Me`], ['team', `${ic('users-round', 'sm')}Team`]])}
      ${seg('period', [[7, '7 days'], [30, '30 days'], [90, '90 days']])}
      <select data-dash="project"><option value="all">All Projects</option>${Object.entries(projects).map(([k, p]) => `<option value="${k}" ${D.project === k ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select>
    </div>
    <div class="tiles">
      ${tile('coins', 'Tokens', fmtN(u.total), `${ic('trending-up', 'sm')}${Math.round((1 / prev - 1) * 100)}% vs previous ${D.period} days`)}
      ${tile('receipt', 'Estimated cost', '$' + Math.round(cost).toLocaleString('en'), `≈ $${(cost / u.sessionsN).toFixed(2)} per Session`)}
      ${tile('messages-square', 'Sessions started', u.sessionsN, `${Math.round(u.sessionsN * .62)} with a Merge request`)}
      ${tile('git-merge', 'Merge requests merged', Math.round(u.sessionsN * .48), `${Math.round(u.sessionsN * .08)} still open`)}
      ${tile('timer', 'Median agent run', '6m 40s', 'Working → Waiting')}
      ${tile('inbox', 'Median wait for you', team ? '38m' : '22m', 'Time a Session sits in the Inbox')}
    </div>
    <div class="cards">
      <div class="card wide"><div class="card-head"><h3>Tokens per day</h3><div class="legend">${u.projs.map(p => `<span><span class="sw" style="background:${projects[p].color}"></span>${esc(projects[p].name)}</span>`).join('')}</div><span class="grow"></span>
        <button class="icon-btn sm" title="${D.table ? 'Chart view' : 'Table view'}" data-act="dash" data-k="table" data-v="${!D.table}">${ic(D.table ? 'chart-column' : 'table-2')}</button></div>
        ${D.table ? dayTable(u) : stackedBars(u)}</div>
      <div class="card"><div class="card-head"><h3>Tokens per Project</h3></div>
        ${hbars(u.projs.map(p => [esc(projects[p].name), u.byProject[p], projects[p].color]).sort((a, b) => b[1] - a[1]))}</div>
      <div class="card"><div class="card-head"><h3>Tokens per model</h3></div>
        ${hbars(MODEL_SHARE.map(([m, f]) => [`<span class="tech">${m}</span>`, u.total * f]), 'var(--accent)')}</div>
      <div class="card"><div class="card-head"><h3>Token mix</h3></div>
        <div class="share"><div style="flex:62;background:var(--accent)"></div><div style="flex:30;background:color-mix(in srgb, var(--accent) 55%, var(--panel))"></div><div style="flex:8;background:color-mix(in srgb, var(--accent) 25%, var(--panel))"></div></div>
        <div class="legend"><span><span class="sw" style="background:var(--accent)"></span>cache read 62%</span><span><span class="sw" style="background:color-mix(in srgb, var(--accent) 55%, var(--panel))"></span>input 30%</span><span><span class="sw" style="background:color-mix(in srgb, var(--accent) 25%, var(--panel))"></span>output 8%</span></div>
        <p class="muted" style="font-size:12.5px;margin:10px 0 0">Cache hit rate 67% · saves ≈ $${Math.round(cost * .9).toLocaleString('en')} vs uncached</p></div>
      <div class="card"><div class="card-head"><h3>Session outcomes</h3></div>
        ${hbars([[`<span class="row" style="color:var(--ok)">${ic('git-merge', 'sm')}<span style="color:var(--text)">Merged</span></span>`, u.sessionsN * .48, 'var(--ok)'], [`<span class="row muted">${ic('archive', 'sm')}<span style="color:var(--text)">Archived, no MR</span></span>`, u.sessionsN * .3, 'var(--muted)'], [`<span class="row" style="color:var(--work)">${ic('git-pull-request', 'sm')}<span style="color:var(--text)">Open</span></span>`, u.sessionsN * .14, 'var(--work)'], [`<span class="row" style="color:var(--err)">${ic('triangle-alert', 'sm')}<span style="color:var(--text)">Stuck at least once</span></span>`, u.sessionsN * .08, 'var(--err)']])}</div>
      ${team ? `<div class="card wide"><div class="card-head"><h3>By member</h3></div><table class="data"><tr><th>Member</th><th class="n">Sessions</th><th class="n">Tokens</th><th class="n">Est. cost</th><th class="n">MRs merged</th><th class="n">Median wait for you</th></tr>
        ${MEMBERS.map((m, i) => { const f = [.24, .27, .19, .18, .12][i]; return `<tr><td>${m === 'you' ? '<b>you</b>' : m}</td><td class="n">${Math.round(u.sessionsN * f)}</td><td class="n">${fmtN(u.total * f)}</td><td class="n">$${Math.round(cost * f)}</td><td class="n">${Math.round(u.sessionsN * f * .48)}</td><td class="n">${[22, 41, 15, 63, 30][i]}m</td></tr>`; }).join('')}</table></div>` : ''}
      <div class="card wide"><div class="card-head"><h3>Top Sessions by tokens</h3><span class="muted" style="font-size:12px">${team ? 'titles of teammates\' Sessions are not shared' : 'click to open'}</span></div><table class="data">
        <tr><th>Session</th><th>Project</th><th>Agent · model</th><th class="n">Tokens</th><th class="n">Working time</th><th>Status</th></tr>
        ${top.slice(0, 6).map(({ s, tok, dur }, i) => `<tr class="${team && i % 2 ? '' : 'click'}" ${team && i % 2 ? '' : `data-act="sel" data-id="${s.id}"`}><td>${team && i % 2 ? `<span class="muted">${MEMBERS[i % 5 || 1]}'s Session</span>` : esc(s.title)}</td><td>${projTag(s.project)}</td><td><span class="tech">${i % 4 === 3 ? 'OpenCode' : 'Pi'} · ${MODEL_SHARE[i % 3][0]}</span></td><td class="n">${fmtN(tok)}</td><td class="n">${dur}m</td><td>${statusIcon(s)}</td></tr>`).join('')}
      </table></div>
    </div>
  </main>`;
}

// ---------- command palette ----------
function actions() {
  const s = byId(state.sel);
  return [
    { icon: 'square-pen', label: 'New Session', kbd: 'N', run: () => toast('New Session') },
    { icon: 'circle-dot', label: 'New Session from issue…', run: () => toast('Pick an issue') },
    { icon: 'folder-plus', label: 'Add Project', run: () => toast('Add Project') },
    { icon: 'arrow-right-to-line', label: 'Go to next waiting Session', kbd: 'J', run: nextWaiting },
    { icon: s.mr ? 'git-pull-request' : 'git-pull-request-create', label: (s.mr ? 'Open Merge request ' + s.mr : 'Create Merge request') + ' for current Session', run: () => toast('Merge request') },
    { icon: 'file-plus-2', label: 'Create spec Artifact from current Session', run: () => toast('Create spec Artifact') },
    { icon: 'chart-column', label: 'Open dashboard', run: () => { state.view = 'dashboard'; } },
    { icon: 'file-diff', label: 'Toggle changes panel', kbd: 'D', run: toggleDiff },
    { icon: 'archive', label: 'Archive current Session', kbd: 'E', run: () => archive(s.id) },
    { icon: 'brain', label: 'Edit Project memory', run: () => toast('Project memory') },
    { icon: 'user-round-cog', label: 'Edit User memory', run: () => toast('User memory') },
    ...Object.entries(THEMES).map(([k, t]) => ({ icon: 'palette', label: 'Theme: ' + t.label, run: () => setTheme(k) })),
    { icon: 'settings', label: 'Open settings', kbd: ',', run: () => toast('Settings') },
  ];
}
const FILTERS = ['is:waiting', 'is:working', 'is:archived', 'is:unread', 'has:mr', ...Object.values(projects).map(p => 'project:' + p.name)];
function paletteResults() {
  const toks = state.palette.q.toLowerCase().split(/\s+/).filter(Boolean);
  const filters = toks.filter(t => /^(is|has|project):/.test(t)), text = toks.filter(t => !filters.includes(t)).join(' ');
  const match = s => filters.every(f => {
    const [k, v] = f.split(':');
    if (k === 'is') return v === 'unread' ? s.unread : s.status === v;
    if (k === 'has') return v === 'mr' ? !!s.mr : v === 'issue' ? !!s.issue : true;
    return projects[s.project].name.startsWith(v);
  }) && (s.title + ' ' + s.branch + ' ' + projects[s.project].name + ' ' + (s.issue || '')).toLowerCase().includes(text);
  const acts = filters.length ? [] : actions().filter(a => a.label.toLowerCase().includes(text));
  const order = { waiting: 0, working: 1, archived: 2 };
  const sess = sessions.filter(match).sort((a, b) => order[a.status] - order[b.status]);
  return { acts, sess, filters };
}
function Palette() {
  if (!state.palette) return '';
  const { acts, sess, filters } = paletteResults();
  let i = 0; const hi = state.palette.hi;
  const actHtml = acts.map(a => `<div class="res ${i === hi ? 'hi' : ''}" data-act="run" data-i="${i++}">${ic(a.icon)}<span>${esc(a.label)}</span>${a.kbd ? `<kbd>${a.kbd}</kbd>` : ''}</div>`).join('');
  const sessHtml = sess.map(s => `<div class="res ${i === hi ? 'hi' : ''}" data-act="run" data-i="${i++}">${statusIcon(s)}${projTag(s.project)}<span class="grow ellipsis">${esc(s.title)}</span>${refs(s)}${s.status === 'working' ? elapsed(s) : `<span class="time">${s.time}</span>`}</div>`).join('');
  return `<div class="overlay" data-act="close-palette"><div class="palette" data-stop>
    <div class="in">${ic('search')}<input id="pal" placeholder="Type a command, or search Sessions…" value="${esc(state.palette.q)}"><kbd>Esc</kbd></div>
    <div class="filters">${FILTERS.map(f => `<span class="f ${filters.includes(f) ? 'on' : ''}" data-act="filter" data-v="${f}">${f}</span>`).join('')}</div>
    <div class="results">${actHtml ? `<div class="grp">Actions</div>${actHtml}` : ''}${sessHtml ? `<div class="grp">Sessions · ${sess.length}</div>${sessHtml}` : ''}${!actHtml && !sessHtml ? '<p class="muted" style="padding:16px;text-align:center">No match</p>' : ''}</div>
    <footer><span><kbd>↑</kbd><kbd>↓</kbd> navigate</span><span><kbd>Enter</kbd> run / open</span><span>filters: <code>is:</code> <code>project:</code> <code>has:</code></span></footer>
  </div></div>`;
}
function runPaletteItem(i) {
  const { acts, sess } = paletteResults();
  state.palette = null;
  if (i < acts.length) acts[i].run(); else if (sess[i - acts.length]) selectSession(sess[i - acts.length].id);
}

// ---------- actions ----------
function archive(id) {
  const s = byId(id); s.status = 'archived'; delete s.reason; s.time = 'Today';
  toast('Session archived');
  if (state.sel === id) { const n = ofStatus('waiting')[0]; if (n) selectSession(n.id); }
}
function nextWaiting() { const w = ofStatus('waiting'); if (!w.length) return toast('Inbox zero'); selectSession(w[(w.findIndex(x => x.id === state.sel) + 1) % w.length].id); }
function setTheme(k) { state.theme = k; state.font = null; state.mono = null; syncUrl(); }
function send(text) {
  if (!text.trim()) return;
  transcripts[state.sel].push({ who: 'user', text });
  state.composer.draft = ''; state.composer.attachments = [];
  const s = byId(state.sel);
  if (s.status === 'waiting') { s.status = 'working'; delete s.reason; s.snippet = 'Working on your reply…'; s.time = 'now'; s.since = Date.now(); }
  render();
  const c = document.getElementById('chat'); if (c) c.scrollTop = c.scrollHeight;
}
let toastT;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg + ' (stub)'; t.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(() => t.style.display = 'none', 1400); }
function syncUrl() {
  const p = new URLSearchParams({ variant: state.variant, theme: state.theme });
  if (state.font) p.set('font', state.font);
  if (state.mono) p.set('mono', state.mono);
  history.replaceState(null, '', '?' + p);
}

// ---------- render ----------
function render() {
  const root = document.documentElement;
  root.dataset.theme = state.theme;
  const font = state.font || THEMES[state.theme].font;
  root.style.setProperty('--font', `"${font}", system-ui, sans-serif`);
  root.style.setProperty('--mono', `"${state.mono || THEMES[state.theme].mono}", ui-monospace, monospace`);
  document.getElementById('root').innerHTML = `<div class="app"><aside class="side">${SideB()}</aside>${state.view === 'dashboard' ? Dashboard() : Main() + Diff()}</div>${Palette()}`;
  const d = state.diff, s = byId(state.sel);
  document.getElementById('switcher').innerHTML = `<span>Settled: ${VARIANTS.B}</span>
    <select data-pill="theme">${Object.entries(THEMES).map(([k, t]) => `<option value="${k}" ${k === state.theme ? 'selected' : ''}>${t.label}</option>`).join('')}</select>
    <select data-pill="font" title="UI font"><option value="">${THEMES[state.theme].font} (theme)</option>${FONTS.map(f => `<option ${f === state.font ? 'selected' : ''}>${f}</option>`).join('')}</select>
    <select data-pill="mono" title="Monospace font"><option value="">${THEMES[state.theme].mono} (theme)</option>${MONOS.map(f => `<option ${f === state.mono ? 'selected' : ''}>${f}</option>`).join('')}</select>
    <span class="state">${state.sel} · ${s.status}${s.reason ? '/' + s.reason : ''} · diff ${d.open ? 'open' : 'closed'}/${d.loading ? 'loading' : d.loaded ? 'loaded' : 'unloaded'} · ${state.composer.agent}/${state.composer.model}</span>`;
  if (window.lucide) lucide.createIcons();
  const pal = document.getElementById('pal');
  if (pal) { pal.focus(); pal.setSelectionRange(pal.value.length, pal.value.length); }
}
function setVariant(dir) {
  const keys = Object.keys(VARIANTS);
  state.variant = keys[(keys.indexOf(state.variant) + dir + keys.length) % keys.length];
  syncUrl(); render();
}

// ---------- events ----------
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  if (el.dataset.act === 'close-palette' && e.target.closest('[data-stop]')) return;
  const { act, id, v, k, i } = el.dataset;
  e.stopPropagation();
  switch (act) {
    case 'v-prev': return setVariant(-1);
    case 'v-next': return setVariant(1);
    case 'sel': selectSession(id); break;
    case 'section': state.sections[v] = !state.sections[v]; break;
    case 'diff': toggleDiff(); break;
    case 'tool': state.openTools[k] = !(state.openTools[k] ?? el.closest('.tool')?.classList.contains('question')); break;
    case 'answer': return send(v);
    case 'send': return send(document.getElementById('msg').value);
    case 'archive': archive(id); break;
    case 'unread': byId(id).unread = true; break;
    case 'attach': state.composer.attachments.push([{ name: 'screenshot-2026-10-26.png', icon: 'image' }, { name: 'error.log', icon: 'file-text' }][state.composer.attachments.length % 2]); break;
    case 'unattach': state.composer.attachments.splice(+v, 1); break;
    case 'palette': state.palette = { q: '', hi: 0 }; break;
    case 'close-palette': state.palette = null; break;
    case 'filter': { const q = state.palette.q.split(/\s+/).filter(Boolean); state.palette.q = (q.includes(v) ? q.filter(t => t !== v) : [...q, v]).join(' ') + ' '; state.palette.hi = 0; break; }
    case 'run': runPaletteItem(+i); break;
    case 'dashboard': state.view = 'dashboard'; break;
    case 'dash': state.dash[k] = k === 'period' ? +v : k === 'table' ? v === 'true' : v; break;
    case 'stub': e.preventDefault(); return toast(v);
    default: return;
  }
  render();
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.set) { state.composer[t.dataset.set] = t.value; render(); }
  if (t.dataset.dash) { state.dash[t.dataset.dash] = t.value; render(); }
  if (t.dataset.pill === 'theme') { setTheme(t.value); render(); }
  if (t.dataset.pill === 'font') { state.font = t.value || null; syncUrl(); render(); }
  if (t.dataset.pill === 'mono') { state.mono = t.value || null; syncUrl(); render(); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'pal') { state.palette.q = e.target.value; state.palette.hi = 0; render(); }
  if (e.target.id === 'msg') state.composer.draft = e.target.value;
});
document.addEventListener('mousemove', e => {
  const tip = document.getElementById('tip'), el = e.target.closest('[data-tip]');
  if (!el) { tip.style.display = 'none'; return; }
  tip.innerHTML = el.dataset.tip; tip.style.display = 'block';
  const r = tip.getBoundingClientRect();
  tip.style.left = Math.min(e.clientX + 14, innerWidth - r.width - 8) + 'px';
  tip.style.top = Math.min(e.clientY + 14, innerHeight - r.height - 8) + 'px';
});
document.addEventListener('keydown', e => {
  const typing = e.target.matches('input, textarea, select, [contenteditable]');
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); state.palette = state.palette ? null : { q: '', hi: 0 }; return render(); }
  if (state.palette) {
    const { acts, sess } = paletteResults(), n = acts.length + sess.length;
    if (e.key === 'Escape') { state.palette = null; return render(); }
    if (e.key === 'ArrowDown') { e.preventDefault(); state.palette.hi = Math.min(state.palette.hi + 1, n - 1); return render(); }
    if (e.key === 'ArrowUp') { e.preventDefault(); state.palette.hi = Math.max(state.palette.hi - 1, 0); return render(); }
    if (e.key === 'Enter') { e.preventDefault(); runPaletteItem(state.palette.hi); return render(); }
    return;
  }
  if (e.target.id === 'msg' && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); return send(e.target.value); }
  if (typing) return;
  if (e.key === 'ArrowLeft') return setVariant(-1);
  if (e.key === 'ArrowRight') return setVariant(1);
  if (e.key === 'j') { nextWaiting(); return render(); }
  if (e.key === 'd') { toggleDiff(); return render(); }
  if (e.key === 'e') { archive(state.sel); return render(); }
});
render();
</script>
</body>
</html>
