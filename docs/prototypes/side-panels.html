<!doctype html>
<!--
  PROTOTYPE — throwaway. "Side panels" restructure of the open Session's right side and Dock.
  Question: does the three-layer model (A: glance strip, B: one panel model for the right area and the Dock,
  C: review mode) hold up once it is clickable, before the panel registry and the Merge request panel (#131)
  are built on it?
  How to run: open this file in a browser. No build step; the app's own styles are inlined verbatim
  (apps/client/src/renderer/styles.css and popover.css, then the prototype's additions). Icons are inline
  SVGs drawn after Lucide's, so nothing but Google Fonts is fetched. All data is fake; every action is a stub.
  Try: the chips under the Session header; right-click a tab (or its ⋯) for Move to bottom / right; the +
  on either tab bar; drag the right area's left edge (each panel keeps its own width); ⤢ on Changes or on the
  Merge request's Diff tab, then Esc; narrow the window below 1100px (or use the pill) for the drawer.
  The pill at the bottom left is not part of the design: theme, window mode, reset, and the live state.
  Decisions (docs/adr/0009-one-panel-model.md): sizes are per panel kind (every Terminal shares one), the composer
  spans only the conversation, review mode hides the Side area, and tabs that don't fit drop to icon and badge,
  then go into the ⌄ menu.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loom side panels prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Geist:wght@400;500;600;700&family=Atkinson+Hyperlegible:wght@400;700&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Geist+Mono:wght@400;500&family=Fira+Code:wght@400;500&family=Source+Code+Pro:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ===== verbatim: apps/client/src/renderer/styles.css ===== */

}
/* ---- themes ---- */

  --wait:#895b17; --work:#2967a8; --ok:#28724d; --err:#bd2e2e; --user:#efe2d2; --user-line:#e0cdb4; --code:#f1ede3; --sel:#f0e3d4; --shadow:#0003; }
[data-theme="nord"] { --bg:#2e3440; --panel:#323945; --panel2:#3b4252; --hover:#434c5e; --line:#434c5e; --text:#eceff4; --muted:#b7becd; --accent:#93c6d4; --accent-text:#2e3440;
  --wait:#ebcb8b; --work:#a8c4e0; --ok:#adc599; --err:#ffa3ab; --user:#3d4a5f; --user-line:#4c5a72; --code:#272c36; --sel:#3e4a5e; --shadow:#0008; }
[data-theme="mocha"] { --bg:#1e1e2e; --panel:#232336; --panel2:#2a2a40; --hover:#313149; --line:#363650; --text:#cdd6f4; --muted:#9fa5bb; --accent:#cba6f7; --accent-text:#1e1e2e;
  --wait:#f9e2af; --work:#89dceb; --ok:#a6e3a1; --err:#f38ba8; --user:#353457; --user-line:#45436e; --code:#181825; --sel:#33334d; --shadow:#000a; }
[data-theme="daylight"] { --bg:#ffffff; --panel:#f6f8fc; --panel2:#eaf1fb; --hover:#e8eaed; --line:#e3e6ea; --text:#1f1f1f; --muted:#5f6368; --accent:#0b57d0; --accent-text:#fff;

* { box-sizing: border-box; }

button, select, input, textarea { font: inherit; color: inherit; }
button { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
button:hover { background: var(--hover); }
.icon-btn { background: none; border: 0; width: 30px; height: 30px; padding: 0; justify-content: center; border-radius: 50%; color: var(--muted); }
.icon-btn:hover { background: var(--hover); color: var(--text); }
.icon-btn.sm { width: 26px; height: 26px; }
.icon-btn.xs { width: 18px; height: 18px; } .icon-btn.xs svg { width: 12px; height: 12px; }
.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.primary:hover { background: var(--accent); filter: brightness(1.08); }
svg.lucide { width: 16px; height: 16px; stroke-width: 2; flex: none; }
.sm svg.lucide, svg.lucide.sm { width: 14px; height: 14px; }
code, pre { font-family: var(--mono); font-size: 12.5px; }
code { background: var(--code); border: 1px solid var(--line); padding: 0 4px; border-radius: 4px; }

.muted { color: var(--muted); }
.row { display: flex; gap: 6px; align-items: center; }
.grow { flex: 1; min-width: 0; }
.ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

@keyframes spin { to { transform: rotate(360deg); } }
.st-waiting-question { color: var(--wait); } .st-waiting-finished { color: var(--ok); } .st-waiting-stuck { color: var(--err); }
.st-working { color: var(--work); } .st-archived { color: var(--muted); }
.proj-tag { display: inline-flex; align-items: center; gap: 5px; font-weight: 600; font-size: 12px; padding: 1px 7px 1px 5px; border-radius: 5px; white-space: nowrap; }

.tech { font-family: var(--mono); font-size: .9em; letter-spacing: -.01em; }
.chip { display: inline-flex; gap: 4px; align-items: center; font-size: 12px; padding: 1px 7px; border-radius: 10px; background: var(--panel2); color: var(--muted); white-space: nowrap; }

/* ---- layout ---- */
.app { display: grid; grid-template-columns: 360px 1fr auto; height: 100%; }
.side { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.side-top { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; }
.search { display: flex; align-items: center; gap: 8px; background: var(--panel2); border-radius: 22px; padding: 8px 14px; color: var(--muted); cursor: text; }
.search kbd { margin-left: auto; }
kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; color: var(--muted); background: var(--panel); }
.compose { align-self: flex-start; padding: 10px 18px; border-radius: 14px; font-weight: 600; }
.side-list { flex: 1; overflow: auto; }
.side-foot { border-top: 1px solid var(--line); padding: 6px 8px; display: flex; gap: 2px; }

/* inbox rows (shared) */
.item { position: relative; cursor: pointer; border-bottom: 1px solid var(--line); }
.item:hover { background: var(--hover); box-shadow: inset 2px 0 0 var(--accent); }
.item.sel { background: var(--sel); }
.item .hover-actions { display: none; position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: inherit; gap: 0; }
.item:hover .hover-actions, .item.menu-open .hover-actions, .item:focus-within .hover-actions { display: flex; background: var(--hover); }
.item:hover .time { visibility: hidden; }
.unread .title { font-weight: 700; }
.unread-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; }
.elapsed { font-family: var(--mono); font-size: 12px; color: var(--work); white-space: nowrap; text-transform: none; letter-spacing: 0; }
.time { font-size: 12px; color: var(--muted); white-space: nowrap; }
.unread .time { color: var(--text); font-weight: 600; }
.snippet { color: var(--muted); font-size: 13px; }

/* Variant B: grouped by project */
.B-group-head { display: flex; align-items: center; gap: 8px; padding: 12px 12px 6px; position: sticky; top: 0; background: var(--panel); z-index: 1; }
.B-group-head b { font-size: 13px; }
.B-item { padding: 7px 12px 7px 46px; border-bottom: 0; }
.B-item .l1 { display: flex; align-items: center; gap: 8px; }
.B-item .l2 { display: flex; gap: 8px; margin-top: 1px; color: var(--muted); font-size: 12px; }
.section-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; color: var(--muted); cursor: pointer; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; border-top: 1px solid var(--line); }
.section-head:hover { color: var(--text); }
.mini { display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 16px; cursor: pointer; font-size: 13px; }
.mini:hover { background: var(--hover); } .mini.sel { background: var(--sel); }

/* ---- main ---- */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.main-head { padding: 10px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; }
.crumb { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
.main-head h1 { font-size: 16px; margin: 0; font-weight: 650; }
.meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.chat { flex: 1; overflow: auto; padding: 20px 28px; }
.msg { display: flex; gap: 12px; margin: 16px 0; }

.msg .body { min-width: 0; }
.msg.agent .body, .msg.user .body { flex: 1; }
.msg.user .bubble { max-width: 85%; background: var(--user); border: 1px solid var(--user-line); padding: 8px 14px; border-radius: 16px 16px 4px 16px; }
.msg.agent .bubble { background: var(--panel); border: 1px solid var(--line); padding: 8px 14px; border-radius: 4px 16px 16px 16px; }
.msg .name { font-size: 12px; color: var(--muted); margin-bottom: 3px; }
.tools { margin-left: 42px; }
.tool { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); margin: 6px 0; overflow: hidden; }
.tool-head { display: flex; gap: 8px; align-items: center; padding: 6px 10px; cursor: pointer; font-size: 13px; }
.tool-head .name { font-family: var(--mono); font-size: 12px; color: var(--accent); }
.tool-body { border-top: 1px solid var(--line); padding: 8px 10px; }
.fold > .tool-head { width: 100%; border: 0; border-radius: 0; background: none; color: inherit; font: inherit; font-size: 13px; text-align: left; }
.fold > .tool-head:hover { background: var(--hover); }
.fold > .tool-head:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.fold .chev { color: var(--muted); flex: none; transition: transform .15s; } .fold .chev.open { transform: rotate(90deg); }
.tool.thinking { background: transparent; border-style: dashed; color: var(--muted); }
.thinking-text { white-space: pre-wrap; font-size: 13px; font-style: italic; color: var(--muted); }
.tool-status { display: inline-flex; flex: none; } .tool-status.running { color: var(--work); } .tool-status.completed { color: var(--ok); } .tool-status.failed { color: var(--err); }
.tool.tool-call.failed { border-color: color-mix(in srgb, var(--err) 45%, var(--line)); }
.tool-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tool-label { display: flex; gap: 6px; align-items: center; font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 4px 0; }
.tool-output { margin: 0 0 8px; max-height: 320px; overflow: auto; background: var(--code); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; white-space: pre-wrap; word-break: break-word; }
.tool.question { border-color: var(--wait); box-shadow: 0 0 0 3px color-mix(in srgb, var(--wait) 15%, transparent); }
.tool.question .name { color: var(--wait); }
.opts { display: flex; gap: 6px; flex-wrap: wrap; }
.tool.ask .tool-head { cursor: default; }
.ask-message { margin: 0 0 8px; white-space: pre-wrap; }
.ask-hint { font-size: 12px; margin: 4px 0 0; }
.approval-detail { margin: 0 0 4px; padding: 6px 8px; white-space: pre-wrap; word-break: break-all; background: var(--panel2); border-radius: 4px; }
.approval-message { display: block; width: 100%; margin: 8px 0; box-sizing: border-box; }
.ask-step input[type='number']:focus-visible, .ask-choice input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.ask-choices { display: grid; gap: 6px; }
.ask-choice { display: flex; gap: 10px; align-items: flex-start; text-align: left; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel2); cursor: pointer; }
.ask-choice:hover { background: var(--hover); }
.ask-choice.checked { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--panel2)); }
.ask-choice input { margin: 3px 0 0; flex: none; accent-color: var(--accent); cursor: pointer; }
.ask-choice-text { display: grid; gap: 2px; min-width: 0; font-size: 13px; }
.ask-choice-label { font-weight: 600; }
/* the asked question's panel, docked on the composer */
.composer.docked { border-color: var(--wait); box-shadow: 0 0 0 3px color-mix(in srgb, var(--wait) 15%, transparent), 0 2px 12px var(--shadow); }
.ask-panel { padding: 10px 14px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; max-height: 45vh; overflow: auto; }
.ask-panel-head { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--wait); }
.ask-panel-head .ask-message { margin: 0; color: var(--text); font-weight: 600; }
.ask-step-title { margin: 0 0 4px; font-size: 14px; font-weight: 600; }
.ask-problem { margin: 0; font-size: 12.5px; color: var(--err); }
.ask-own { display: flex; gap: 4px; align-items: center; }
.ask-own .icon-btn { width: 22px; height: 22px; }
.ask-step input[type='number'] { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; width: 12ch; }
.ask-answer { margin: 0; display: grid; gap: 2px; font-size: 13px; }
.ask-answer > div { display: flex; gap: 8px; } .ask-answer dt { color: var(--muted); } .ask-answer dd { margin: 0; white-space: pre-wrap; }

/* composer */
.composer-wrap { padding: 8px 28px 18px; }
.composer { border: 1px solid var(--line); border-radius: 16px; background: var(--panel); box-shadow: 0 2px 12px var(--shadow); }
.composer:focus-within { border-color: var(--accent); }
.attachments { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 12px 0; }
.att { display: inline-flex; align-items: center; gap: 6px; background: var(--panel2); border-radius: 8px; padding: 4px 6px 4px 8px; font-size: 12px; }
.composer textarea { width: 100%; border: 0; outline: none; background: none; resize: none; padding: 12px 14px 4px; min-height: 52px; max-height: 200px; }
.ctoolbar { display: flex; align-items: center; gap: 4px; padding: 6px 8px; }
.pick { position: relative; display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 8px; color: var(--muted); font-size: 12.5px; cursor: pointer; }
.pick:hover { background: var(--hover); color: var(--text); }
.settings-fields { display: flex; flex-direction: column; gap: 10px; padding: 12px 14px; }
.field-row { display: grid; grid-template-columns: 160px minmax(170px, 260px); align-items: center; gap: 12px; }
.approval-row { grid-template-columns: minmax(260px, 420px) 120px; }
.approval-description { display: block; font-size: 12px; }
.pick b { color: var(--text); font-weight: 500; }
.pick input.branch { border: 0; background: transparent; color: var(--text); outline: none; width: 22ch; padding: 0; }
.sep { width: 1px; height: 18px; background: var(--line); margin: 0 4px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg span { padding: 2px 9px; font-size: 12px; cursor: pointer; color: var(--muted); display: inline-flex; gap: 4px; align-items: center; }
.seg span.on { background: var(--panel2); color: var(--text); }
.seg button { padding: 2px 9px; font-size: 12px; color: var(--muted); background: none; border: 0; border-radius: 0; }
.seg button.on { background: var(--panel2); color: var(--text); }
.gauge { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); padding: 0 6px; }
.send { border-radius: 10px; padding: 6px 12px; }
.hint { font-size: 11.5px; color: var(--muted); padding: 6px 4px 0; display: flex; gap: 12px; }

/* diff */
.diff { width: min(44vw, 640px); border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
.diff header { padding: 10px 12px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
.diff .scroll { flex: 1; overflow: auto; padding: 0 12px; }
.diff-file { border: 1px solid var(--line); border-radius: 8px; margin: 10px 0; overflow: hidden; }
.diff-file h4 { margin: 0; padding: 6px 10px; background: var(--panel2); font: 500 12px var(--mono); display: flex; gap: 8px; align-items: center; }
.file-diff {
  --diffs-font-family: var(--mono); --diffs-header-font-family: var(--font); --diffs-font-size: 12px;
  --diffs-bg: var(--panel); background-color: var(--panel);
  --diffs-bg-context-override: var(--panel); --diffs-bg-context-gutter-override: var(--panel);
  --diffs-bg-separator-override: var(--panel2); --diffs-bg-buffer-override: var(--panel2);
  --diffs-fg-number-override: var(--muted);
  --diffs-addition-color-override: var(--ok); --diffs-deletion-color-override: var(--err); --diffs-modified-color-override: var(--accent);
}
.diff-stat { display: inline-flex; align-items: baseline; gap: 6px; font: 600 12px var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.diff-stat .files { color: var(--text); }
.diff-stat .add, .diff-counts .add { color: var(--ok); } .diff-stat .del, .diff-counts .del { color: var(--err); }
.diff-toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); background: transparent; border: 0; cursor: pointer; padding: 2px 4px; border-radius: 6px; }
.diff-toggle .knob { width: 24px; height: 14px; border-radius: 7px; background: var(--panel2); border: 1px solid var(--line); position: relative; }
.diff-toggle .knob::after { content: ''; position: absolute; top: 1px; left: 1px; width: 10px; height: 10px; border-radius: 50%; background: var(--muted); transition: left .12s; }
.diff-toggle[aria-pressed='true'] { color: var(--text); }
.diff-toggle[aria-pressed='true'] .knob { background: color-mix(in srgb, var(--accent) 40%, transparent); border-color: var(--accent); }
.diff-toggle[aria-pressed='true'] .knob::after { left: 11px; background: var(--accent); }
.diff-search { flex: 1; min-width: 0; box-sizing: border-box; background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font: 12px var(--font); }
.diff-tree { flex: 0 0 min(280px, 45%); box-sizing: border-box; align-self: flex-start; max-height: calc(100% - 10px); overflow: auto; margin-bottom: 10px; border: 1px solid var(--line); border-radius: 8px; padding: 4px 0; }
.diff-tree ul { list-style: none; margin: 0; padding: 0; }
.diff-tree-row { width: 100%; display: flex; align-items: center; gap: 6px; padding: 2px 8px; border: 0; background: transparent; color: var(--text); font: 12px var(--mono); cursor: pointer; text-align: left; }
.diff-tree-row:hover { background: var(--panel2); }
.diff-tree-row:disabled { cursor: default; background: transparent; color: var(--text); }
.diff-tree-row svg, .diff-file-toggle svg { width: 13px; height: 13px; flex: none; color: var(--muted); }
.diff-tree-row .name, .diff-file-toggle .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.diff-file-toggle { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; border: 0; background: transparent; color: var(--text); font: inherit; cursor: pointer; padding: 0; text-align: left; }
.diff-status { font: 500 10.5px var(--ui, inherit); padding: 0 6px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.diff-status.modified { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 50%, transparent); }
.diff-status.untracked { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 50%, transparent); }
/* Just a dot in the narrow file list: the word stays for screen readers, and in each file's header. */
.diff-tree .diff-status { flex: none; font-size: 0; padding: 0; width: 7px; height: 7px; border: 0; background: currentColor; }
.diff-counts { font: 11px var(--mono); color: var(--muted); white-space: nowrap; }
.diff-note { padding: 8px 10px; font-size: 12px; color: var(--muted); }
/* The note on a line or range, drawn by the diff library under its last line. */
.diff-comment { margin: 6px 10px; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel2); font: 13px var(--font); display: flex; flex-direction: column; gap: 6px; white-space: normal; }
.diff-comment textarea { width: 100%; box-sizing: border-box; resize: vertical; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; outline: none; }
.diff-comment textarea:focus { border-color: var(--accent); }
.diff-comment .row { gap: 6px; font-size: 12px; }
.diff-loading { padding: 30px; color: var(--muted); text-align: center; display: flex; gap: 8px; justify-content: center; }

/* dashboard (also the layout of other full pages, like Settings) */
.dash { overflow: auto; padding: 20px 28px 90px; min-width: 0; }
.dash h1 { font-size: 20px; margin: 0; }
.dash-filters { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 12px 0 18px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; margin-bottom: 16px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-width: 0; }
.tile .k { color: var(--muted); font-size: 12.5px; display: flex; gap: 6px; align-items: center; }
.tile .v { font-size: 26px; font-weight: 650; letter-spacing: -.02em; margin: 2px 0; font-variant-numeric: tabular-nums; }
.tile .d { font-size: 12px; color: var(--muted); }
.legend { display: flex; gap: 14px; font-size: 12.5px; color: var(--muted); }
.legend.wrap { flex-wrap: wrap; gap: 6px 14px; }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.chart svg { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font: 8.5px var(--mono); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .hit { fill: transparent; cursor: crosshair; }
.chart .hit:hover { fill: color-mix(in srgb, var(--text) 6%, transparent); }
.hbars { list-style: none; margin: 0; padding: 0; }
.hbar { display: grid; grid-template-columns: minmax(0, 170px) 1fr 64px; gap: 10px; align-items: center; padding: 5px 0; font-size: 13px; }
.hbar .track { height: 12px; display: block; }
.hbar .fill { display: block; height: 100%; border-radius: 0 4px 4px 0; min-width: 2px; }
.hbar .val { text-align: right; font-family: var(--mono); font-size: 12px; }
.share { display: flex; height: 10px; border-radius: 5px; overflow: hidden; gap: 2px; margin: 8px 0 10px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; min-width: 0; }
.card.wide { grid-column: 1 / -1; }
.card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.card-head h3 { margin: 0; font-size: 14px; font-weight: 600; }
table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
table.data th { text-align: left; color: var(--muted); font-weight: 500; font-size: 12px; padding: 6px 8px; border-bottom: 1px solid var(--line); }
table.data td { padding: 7px 8px; border-bottom: 1px solid var(--line); }
table.data td.n, table.data th.n { text-align: right; font-family: var(--mono); font-size: 12px; }
table.data tr.click { cursor: pointer; } table.data tr.click:hover td { background: var(--hover); }

/* ---- Loom additions (not in the prototype) ---- */
#root { height: 100%; }
/* Section heads are buttons here, for keyboard access. */
button.section-head { width: 100%; background: none; border: 0; border-top: 1px solid var(--line); border-radius: 0; }
button.section-head:hover { background: none; }
button.search { border: 0; width: 100%; text-align: left; }
.side-foot .icon-btn[aria-current="page"] { color: var(--accent); }
/* Empty states, styled like the prototype's diff loading line. */
.empty { padding: 30px; color: var(--muted); text-align: center; display: flex; gap: 8px; justify-content: center; align-items: center; }
.st-connected { color: var(--ok); } .st-starting { color: var(--work); } .st-unresponsive { color: var(--wait); }
.st-disconnected, .st-failed { color: var(--err); }
.err { color: var(--err); font-size: 12px; }
.warn { color: var(--wait); font-size: 12px; max-width: 46ch; margin-top: 2px; }
.ag-ready { color: var(--ok); } .ag-checking { color: var(--work); } .ag-signed-out, .ag-unsupported { color: var(--wait); }
.ag-missing, .ag-error { color: var(--err); } .ag-unknown { color: var(--muted); }
.fg-available { color: var(--ok); } .fg-checking { color: var(--work); } .fg-off { color: var(--wait); } .fg-unknown { color: var(--muted); }
input.prefix { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; width: 16ch; }
.pick .issue-title { max-width: 28ch; }
.popover.issue-popover { width: 360px; gap: 4px; }
/* Sidebar rows and status are buttons here. */
button.mini { width: 100%; background: none; border: 0; border-radius: 0; text-align: left; }
.st-waiting-error, .st-waiting-interrupted, .st-waiting-stopped { color: var(--err); }
.st-waiting-approval, .st-waiting-feedback, .st-waiting-unsaved-work { color: var(--wait); }
.bubble { overflow-wrap: anywhere; }
.tool.failed { border-color: var(--err); } .tool.failed .name { color: var(--err); }
.composer-wrap button.send:disabled { opacity: .5; cursor: default; filter: none; }
/* Inbox rows open their Session from a button, beside the hover actions. */
.B-item { padding: 0; }
.B-item > button.open { display: block; width: 100%; background: none; border: 0; border-radius: 0; padding: 7px 12px 7px 46px; text-align: left; }
.B-item > button.open:hover { background: none; }
.B-item .row-error { padding: 0 12px 7px 46px; }
.scrim { position: fixed; inset: 0; background: var(--shadow); display: grid; place-items: center; z-index: 50; }
.modal { width: min(440px, calc(100vw - 32px)); box-shadow: 0 12px 40px var(--shadow); }
.modal p { margin: 0 0 12px; color: var(--muted); }
.modal-actions { justify-content: flex-end; gap: 8px; margin-top: 12px; }
.danger { background: var(--err); color: var(--bg); border-color: var(--err); }
.warn-icon, .flag-missing { color: var(--err); }

.database-problem { max-width: 720px; margin: 60px auto; padding: 0 24px; display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
.database-problem h1 { display: flex; gap: 8px; align-items: center; font-size: 18px; color: var(--err); }
.database-problem ul { margin: 0; padding-left: 20px; }

.popover.search-popover { width: max-content; min-width: 360px; gap: 4px; }
.diff-base { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 8px 0 0; font-size: 12px; }

/* the queue, above the composer, and where the user interrupted a run */
.queue { list-style: none; margin: 0 8px 6px; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.queue li { display: flex; align-items: center; gap: 8px; padding: 5px 6px 5px 12px; border: 1px dashed var(--line); border-radius: 10px; background: var(--panel); color: var(--muted); }
.queue li .grow { color: var(--text); min-width: 0; }
.queue li button:not(.icon-btn) { border-radius: 8px; padding: 3px 9px; font-size: 12.5px; }
.interruption { display: flex; align-items: center; justify-content: center; gap: 6px; margin: 4px 0; font-size: 12.5px; color: var(--muted); }

/* Markdown in chat messages; highlighting takes the theme's own colours */
.md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
.md p, .md ul, .md ol, .md table, .md .code-block, .md .quote-block { margin: 6px 0; }
.md ul, .md ol { padding-left: 22px; }
.md li > p { margin: 2px 0; }
.md .contains-task-list { list-style: none; padding-left: 4px; }
.md .task-list-item > input[type="checkbox"] { margin: 0 6px 0 0; vertical-align: -1px; }
.md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { margin: 12px 0 6px; line-height: 1.3; font-weight: 650; }
.md h1 { font-size: 1.35em; } .md h2 { font-size: 1.2em; } .md h3 { font-size: 1.08em; } .md h4, .md h5, .md h6 { font-size: 1em; }
.md a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }

.md :not(pre) > code { font-size: .9em; }
.md table { border-collapse: collapse; display: block; max-width: 100%; overflow-x: auto; }
.md th, .md td { border: 1px solid var(--line); padding: 4px 10px; text-align: left; }
.md th { background: var(--panel2); font-weight: 600; }
.md .code-block { border: 1px solid var(--line); border-radius: 6px; background: var(--code); overflow: hidden; }
.md .code-block figcaption { display: flex; align-items: center; gap: 8px; padding: 2px 4px 2px 10px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 11.5px; }
/* the figure is the block's frame: its pre and code take none of the global code styles */
.md .code-block pre { margin: 0; padding: 8px 10px; border: 0; border-radius: 0; background: none; overflow-x: auto; white-space: pre; overflow-wrap: normal; color: var(--text); }
.md .code-block pre code { background: none; border: 0; padding: 0; border-radius: 0; }
.md .quote-block { position: relative; }
.md blockquote { margin: 0; padding: 2px 64px 2px 12px; border-left: 3px solid var(--line); color: var(--muted); }
.md .quote-block > .copy-btn { position: absolute; top: 0; right: 0; }
.copy-btn { padding: 1px 6px; font-size: 11.5px; background: transparent; border-color: transparent; color: var(--muted); }
.copy-btn:hover { background: var(--hover); color: var(--text); }
.copy-btn.failed { color: var(--err); }
.hljs-comment, .hljs-quote { color: var(--muted); font-style: italic; }
.hljs-keyword, .hljs-selector-tag, .hljs-built_in, .hljs-doctag, .hljs-meta .hljs-keyword { color: var(--accent); }
.hljs-string, .hljs-regexp, .hljs-addition, .hljs-attribute, .hljs-template-tag, .hljs-template-variable { color: var(--ok); }
.hljs-number, .hljs-literal, .hljs-symbol, .hljs-bullet, .hljs-variable.constant_ { color: var(--wait); }
.hljs-title, .hljs-section, .hljs-function .hljs-title, .hljs-name, .hljs-selector-id, .hljs-selector-class { color: var(--work); }
.hljs-type, .hljs-class .hljs-title, .hljs-params, .hljs-attr, .hljs-property { color: var(--text); }
.hljs-deletion, .hljs-meta { color: var(--err); }
.hljs-emphasis { font-style: italic; } .hljs-strong { font-weight: 600; }

/* The composer's attachments, and the files and images a sent message has. */
.attachments { list-style: none; margin: 0; padding: 8px 12px 0; display: flex; flex-wrap: wrap; gap: 6px; }
.bubble .attachments { padding: 6px 0 0; }
.attachments .chip { max-width: 260px; gap: 5px; }
.attachments .icon-btn.sm { padding: 0; width: 16px; height: 16px; }
/* What `/` and `@` offer, over the prompt. */
.composer-menu { margin: 6px 6px 0; max-height: 320px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; border-bottom: 1px solid var(--line); padding: 2px 0 6px; }
/* Rows keep their height: they don't shrink to fit the list. */
.composer-menu [role="option"] { flex-shrink: 0; display: flex; align-items: center; gap: 10px; min-height: 34px; padding: 6px 10px; border-radius: 8px; cursor: pointer; font-size: 13px; line-height: 1.4; white-space: nowrap; overflow: hidden; }
.composer-menu [role="option"] > svg { flex-shrink: 0; color: var(--muted); }
.composer-menu [role="option"][aria-selected="true"] > svg { color: var(--accent); }
.composer-menu .cmd-name { flex-shrink: 0; max-width: 45%; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
.composer-menu .cmd-name .muted { font-weight: 400; margin-right: 1px; }
.composer-menu .cmd-desc { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; color: var(--muted); font-size: 12.5px; }
.composer-menu .chip { flex-shrink: 0; padding: 2px 8px; border: 1px solid var(--line); background: var(--panel); }
.composer-menu [role="option"][aria-selected="true"] { background: var(--sel); }
.composer-menu-empty { padding: 6px 10px; font-size: 13px; }
/* Merge request: the timeline card's Open, the Link popover. */
.merge-request .link, .info .link { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font: inherit; }
.merge-request .link:hover, .info .link:hover { text-decoration: underline; }
.info .link { display: inline-flex; align-items: center; gap: 4px; }
.icon-btn.mr-btn { width: auto; gap: 4px; padding: 0 10px; border-radius: 15px; font-size: 12px; }
.link-mr form { display: flex; flex-direction: column; gap: 8px; padding: 10px; width: 280px; }
.link-mr label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
.link-mr .primary { align-self: flex-end; }
/* The open Session's right sidebar: its views' tabs, and its left edge to resize it by. */
.sidebar { position: relative; border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.sidebar > header { padding: 8px 12px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
.sidebar-tabs { display: flex; gap: 2px; }
.sidebar-tabs [role="tab"][aria-selected="true"] { background: var(--sel); color: var(--text); }
.sidebar-view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.sidebar-view .scroll { flex: 1; overflow: auto; padding: 0 12px; }
.sidebar-edge { position: absolute; left: -3px; top: 0; bottom: 0; width: 6px; cursor: col-resize; z-index: 2; }
.sidebar-edge:hover, .sidebar-edge:focus-visible { background: color-mix(in srgb, var(--accent) 40%, transparent); outline: none; }
body.resizing { cursor: col-resize; user-select: none; }

/* ---- the open Session's bottom dock ---- */
.dock { position: relative; flex: none; display: flex; flex-direction: column; min-height: 0; border-top: 1px solid var(--line); background: var(--panel); }
.dock > header { padding: 4px 12px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
.dock-tabs { display: flex; gap: 2px; min-width: 0; overflow-x: auto; }
.dock-tab { display: inline-flex; align-items: center; gap: 2px; padding: 0 2px 0 8px; border-radius: 6px; color: var(--muted); font-size: 12.5px; white-space: nowrap; }
.dock-tab:hover { background: var(--hover); }
.dock-tab.sel { background: var(--sel); color: var(--text); }
.dock-tab > [role="tab"] { border: 0; background: none; color: inherit; font: inherit; padding: 3px 0; cursor: pointer; }
.dock-tab > [role="tab"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.dock-view { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--code); }
.dock-error { margin: 8px 12px; color: var(--err); font-size: 13px; }
.terminal-host { flex: 1; min-height: 0; padding: 4px 0 0 8px; }
.terminal-screen { height: 100%; }
.dock-edge { position: absolute; top: -3px; left: 0; right: 0; height: 6px; cursor: row-resize; z-index: 2; }
.dock-edge:hover, .dock-edge:focus-visible { background: color-mix(in srgb, var(--accent) 40%, transparent); outline: none; }
body.resizing-rows { cursor: row-resize; user-select: none; }
.sidebar-view .diff-panes { display: flex; flex-direction: column; overflow: hidden; }
.diff-files { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.diff-files-bar { flex: none; display: flex; align-items: center; gap: 6px; padding: 8px 0; }
.diff-files-bar .icon-btn { flex: none; }
.diff-files-bar .icon-btn[aria-pressed='true'] { color: var(--accent); }
.state-toggle .on-hover, .state-toggle:hover .at-rest, .state-toggle:focus-visible .at-rest { display: none; }
.state-toggle:hover .on-hover, .state-toggle:focus-visible .on-hover { display: block; }
.diff-files-body { flex: 1; min-height: 0; display: flex; gap: 10px; }
.diff-sections { flex: 1; min-width: 0; overflow: auto; }
.diff-sections .diff-file { margin: 0 0 10px; }
.changes-bar { display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-bottom: 1px solid var(--line); }
/* Session info: four groups of facts, each with its actions at the end. */
.info { flex: 1; overflow: auto; padding: 4px 14px 16px; }
.info-group { padding: 10px 0; border-bottom: 1px solid var(--line); }
.info-group h3 { margin: 0 0 6px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.info-group dl { margin: 0; display: flex; flex-direction: column; gap: 2px; }
.fact { display: grid; grid-template-columns: 112px 1fr; gap: 8px; align-items: center; min-height: 28px; font-size: 13px; }
.fact dt { color: var(--muted); }
.fact dd { margin: 0; display: flex; align-items: center; gap: 6px; min-width: 0; }
.fact .value { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.fact .path { word-break: break-all; }
.fact-actions { display: flex; gap: 0; flex: none; }
.fact-actions .icon-btn:disabled { opacity: .4; cursor: default; }
.fact-actions .icon-btn:disabled:hover { background: none; color: var(--muted); }
.info .diff-stat { font-weight: 600; }
.chip.stale { color: var(--wait); }
.tone-passed { color: var(--ok); } .tone-pending { color: var(--wait); } .tone-failed { color: var(--err); } .tone-accent { color: var(--accent); }
.popover.ci-checks { width: 340px; padding: 10px 12px; gap: 4px; }
.ci-checks h4 { margin: 0; font-size: 14px; outline: none; }
.ci-checks p { margin: 0 0 4px; font-size: 12px; }
.ci-checks p.checked { margin: 6px 0 0; }
.ci-checks ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.ci-checks li { display: grid; grid-template-columns: auto 1fr 56px 48px; gap: 8px; align-items: center; font-size: 13px; }
.ci-checks .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ci-checks .link { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font: inherit; text-align: right; }
.ci-checks .link:hover { text-decoration: underline; }
.feedback-items { margin: 0 0 8px; padding: 0 0 0 16px; }
.feedback-items .feedback-items { margin: 4px 0 0; }
.feedback-items li { margin-bottom: 4px; }
.feedback-link { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font: inherit; }
.feedback-link:hover { text-decoration: underline; }
.feedback-excerpt { margin: 2px 0 0; color: var(--muted); overflow-wrap: anywhere; }
.context { display: flex; flex-direction: column; gap: 4px; width: 100%; }
.context .bar { display: block; height: 6px; border-radius: 3px; background: var(--panel2); overflow: hidden; }
.context .bar > span { display: block; height: 100%; background: var(--accent); }
.info-foot { padding-top: 12px; display: flex; justify-content: flex-end; gap: 8px; }
.removed-tag { margin-left: 6px; font-size: 11px; padding: 0 6px; vertical-align: 1px; }

/* ===== verbatim: apps/client/src/renderer/popover.css ===== */
/* Popovers (menus, pickers, selects): fixed to the viewport, themed by the app's variables only. */
.popover { position: fixed; z-index: 50; min-width: 220px; max-width: calc(100vw - 16px); overflow-y: auto; display: flex; flex-direction: column; gap: 2px; padding: 4px; color: var(--text); background: var(--panel2); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 8px 24px var(--shadow); }
.popover [role="option"], .popover [role="menuitem"] { display: flex; align-items: center; gap: 6px; flex-shrink: 0; color: var(--text); background: none; border: 0; border-radius: 6px; padding: 6px 10px; font-weight: 400; font-size: 13px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.popover [role="option"]:hover, .popover [role="menuitem"]:hover, .popover [role="option"]:focus-visible, .popover [role="menuitem"]:focus-visible { background: var(--hover); outline: none; }
.popover [role="option"][aria-selected="true"] { color: var(--accent); }
.popover input { color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; outline: none; }
.popover input:focus { border-color: var(--accent); }
.popover [role="listbox"] { display: flex; flex-direction: column; gap: 2px; }
button.pick { background: none; border: 0; border-radius: 8px; }
button.pick:hover { background: var(--hover); }
button.pick .chev { width: 14px; height: 14px; flex-shrink: 0; color: var(--muted); }
button.pick:hover .chev, button.pick[aria-expanded="true"] .chev { color: var(--text); }
button.pick:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
button.pick:disabled { opacity: .5; cursor: default; }
button.pick:disabled:hover { background: none; }
button.pick:disabled .chev { color: var(--muted); }
/* The field look: a bordered control, value left, chevron right. */
button.select-field { justify-content: space-between; min-width: 170px; padding: 5px 10px; color: var(--text); background: var(--panel2); border: 1px solid var(--line); cursor: pointer; }
button.select-field:hover { background: var(--hover); border-color: var(--muted); }
button.select-field[aria-expanded="true"] { border-color: var(--accent); }
button.select-field:focus-visible { border-color: var(--accent); }
/* A popover centred on the window over the app's `.scrim`: the Project picker. */
.popover.picker-modal { position: relative; width: min(520px, calc(100vw - 32px)); max-height: 60vh; padding: 6px; gap: 6px; overflow: hidden; }
.picker-modal input { flex-shrink: 0; padding: 8px 10px; font-size: 14px; }
.picker-modal [role="listbox"] { overflow-y: auto; }
.picker-modal [role="option"] { gap: 10px; padding: 6px 8px; cursor: pointer; }
.picker-modal [role="option"]:hover { background: none; }
.picker-modal [role="option"][aria-selected="true"] { color: var(--text); background: var(--sel); }
.picker-text { display: flex; flex-direction: column; min-width: 0; }
.picker-name { font-weight: 600; }
.picker-path { font-size: 12px; }
.picker-empty { padding: 6px 8px; }
/* The Ctrl+K palette: near the top of the window, over the app's `.scrim`. */
.scrim.palette-scrim { place-items: start center; padding-top: 12vh; }
.popover.palette { position: relative; width: min(640px, calc(100vw - 32px)); max-height: 70vh; padding: 0; gap: 0; overflow: hidden; border-radius: 14px; box-shadow: 0 20px 60px var(--shadow); }
.palette-in { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); color: var(--muted); }
.popover.palette .palette-in input { flex: 1; border: 0; background: none; padding: 0; font-size: 15px; }
.palette-filters { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 14px; border-bottom: 1px solid var(--line); }
.palette-filters button { font-size: 12px; padding: 2px 8px; border-radius: 10px; border: 1px solid var(--line); background: none; color: var(--muted); }
.palette-filters button[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.palette-results { overflow-y: auto; padding: 6px; }
.palette-group { padding: 8px 10px 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.palette [role="option"] { gap: 10px; padding: 7px 10px; border-radius: 8px; cursor: pointer; }
.palette [role="option"]:hover { background: none; }
.palette [role="option"][aria-selected="true"] { color: var(--text); background: var(--sel); }
.palette [role="option"] kbd { margin-left: auto; }
.palette-project { max-width: 30%; font-size: 12px; }
.palette-empty { padding: 16px; text-align: center; }
.palette-foot { display: flex; gap: 14px; padding: 8px 14px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
/* The Ctrl+? list of shortcuts. */
.shortcut-table { width: 100%; border-collapse: collapse; }
.shortcut-table th { text-align: left; }
.shortcut-table td { padding: 6px 10px; }
.shortcut-table td:last-child { text-align: right; white-space: nowrap; }

/* The custom snooze: until a date and time, or for a duration. */
.popover.snooze-custom { padding: 8px; }
.snooze-form { display: flex; flex-direction: column; gap: 8px; }
.snooze-form .row { display: flex; align-items: center; gap: 6px; }
.snooze-form input[type="number"] { width: 64px; }
.snooze-form .primary { align-self: flex-end; }
.snooze-modes { display: flex; gap: 2px; padding: 2px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
.snooze-modes label { flex: 1; text-align: center; padding: 3px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; color: var(--muted); }
.snooze-modes label.on { background: var(--sel); color: var(--text); }
.snooze-modes input { position: absolute; opacity: 0; pointer-events: none; }

/* Right-click menus: placed against the point clicked. */
.context-point { position: fixed; width: 0; height: 0; pointer-events: none; }
.popover.context-menu { min-width: 200px; }
.popover [role="menuitem"]:disabled { color: var(--muted); opacity: .6; cursor: default; }
.popover [role="menuitem"]:disabled:hover { background: none; }
.menu-separator { height: 1px; margin: 3px 4px; background: var(--line); flex-shrink: 0; }
.menu-icon-space { width: 14px; flex-shrink: 0; }
/* A note on a passage of the conversation, from its right-click menu. */
.popover.conversation-comment { width: 340px; padding: 8px; gap: 6px; }
.conversation-comment blockquote { margin: 0; padding: 2px 8px; border-left: 2px solid var(--line); font-size: 12px; }
.conversation-comment textarea { color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; resize: vertical; font: inherit; outline: none; }
.conversation-comment textarea:focus { border-color: var(--accent); }
.conversation-comment .row { display: flex; align-items: center; gap: 6px; }
.popover.rename-session { padding: 8px; }
.rename-session form { display: flex; gap: 6px; }
.rename-session input { min-width: 240px; }


/* ===== prototype additions ===== */
.app { grid-template-columns: 300px 1fr; }
.main { position: relative; }
.main-head { padding: 10px 16px 10px 20px; border-bottom: 0; align-items: center; gap: 8px; container-type: inline-size; container-name: head; }
.head-line { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; }
.head-line h1 { flex: 0 1 auto; min-width: 0; }
.head-line .proj-tag, .head-line .chip { flex: none; }
@container head (max-width: 520px) { .head-line .proj-tag { display: none; } }
.side-top .search { white-space: nowrap; } .side-top .search span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; } .side-top .search kbd { flex: none; white-space: nowrap; }
.B-item > button.open { padding: 7px 12px; }
.side-list { min-height: 0; }
.side-bottom { flex: none; max-height: 48%; overflow: auto; border-top: 1px solid var(--line); }
.side-bottom .section-head:first-child { border-top: 0; }
button.section-head { color: var(--muted); }
.B-item .l2 .proj { font-weight: 600; font-size: 12px; white-space: nowrap; }
.g-chip .branch { max-width: 26ch; overflow: hidden; text-overflow: ellipsis; }
.main-head h1.title-btn { cursor: pointer; border-radius: 6px; padding: 0 4px; margin-left: -4px; }
.main-head h1.title-btn:hover { background: var(--hover); }
.icon-btn[aria-pressed="true"] { color: var(--accent); }

/* A: the glance strip */
.glance { display: flex; align-items: center; gap: 6px; padding: 0 16px 8px 20px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; flex: none; }
.g-chip { display: inline-flex; align-items: stretch; height: 26px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); font-size: 12.5px; overflow: hidden; flex: none; }
.g-chip > button { border: 0; border-radius: 0; background: none; padding: 0 9px; gap: 5px; color: var(--text); white-space: nowrap; }
.g-chip > button:hover, .g-chip > button[aria-expanded="true"] { background: var(--hover); }
.g-chip > button + button { border-left: 1px solid var(--line); }
.g-chip > button:first-child { padding-left: 10px; } .g-chip > button:last-child { padding-right: 10px; }
.g-chip .bad { color: var(--err); } .g-chip .warn-t { color: var(--wait); }
.g-chip.link-issue > button { color: var(--muted); }
.meter { display: inline-block; width: 44px; height: 6px; border-radius: 3px; background: var(--panel2); overflow: hidden; }
.meter > span { display: block; height: 100%; background: var(--accent); }
.g-sep { flex: 1; }

/* B: the body, the right area, the Dock */
.body-row { flex: 1; min-height: 0; display: flex; position: relative; }
.convo { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.area { position: relative; background: var(--panel); display: flex; flex-direction: column; min-height: 0; min-width: 0; flex: none; }
.area.right { border-left: 1px solid var(--line); }
.area.drawer { position: absolute; right: 0; top: 0; bottom: 0; z-index: 20; box-shadow: -14px 0 36px var(--shadow); }
.drawer-scrim { position: absolute; inset: 0; z-index: 19; background: color-mix(in srgb, #000 28%, transparent); }
.area.bottom { border-top: 1px solid var(--line); }
.tabs-bar { display: flex; align-items: flex-end; gap: 4px; padding: 4px 6px 0 6px; border-bottom: 1px solid var(--line); background: var(--bg); min-height: 37px; flex: none; }
.tabs { display: flex; gap: 2px; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.ptab { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 4px 0 10px; border: 1px solid transparent; border-bottom: 0; border-radius: 8px 8px 0 0; color: var(--muted); font-size: 12.5px; white-space: nowrap; cursor: pointer; position: relative; top: 1px; user-select: none; }
.ptab:hover { color: var(--text); background: var(--hover); }
.ptab.on { color: var(--text); background: var(--panel); border-color: var(--line); }
.ptab .x { visibility: hidden; width: 20px; height: 20px; }
.ptab:hover .x, .ptab.on .x { visibility: visible; }
.ptab .tech { color: inherit; }
.badge { font: 600 10.5px/16px var(--mono); padding: 0 5px; border-radius: 8px; background: var(--panel2); color: var(--muted); min-width: 16px; text-align: center; }
.badge.bad { background: color-mix(in srgb, var(--err) 18%, transparent); color: var(--err); }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--err); flex: none; }
.area-tools { margin-left: auto; display: flex; align-items: center; padding-bottom: 4px; flex: none; }
.area-view { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; container-type: inline-size; }
.area-empty { flex: 1; display: grid; place-items: center; color: var(--muted); font-size: 13px; text-align: center; padding: 20px; }
.edge-x { position: absolute; left: -3px; top: 0; bottom: 0; width: 6px; cursor: col-resize; z-index: 3; }
.edge-y { position: absolute; top: -3px; left: 0; right: 0; height: 6px; cursor: row-resize; z-index: 3; }
.edge-x:hover, .edge-y:hover { background: color-mix(in srgb, var(--accent) 40%, transparent); }
.size-tag { display: none; font: 11px var(--mono); color: var(--accent); padding: 0 6px; }
body.resizing .area.right .size-tag, body.resizing-rows .area.bottom .size-tag { display: inline; }
.ptab { flex-shrink: 0; } .ptab > svg, .ptab .badge, .ptab .dot, .ptab .x, .ptab .tech { flex-shrink: 0; }
.ptab .lbl { white-space: nowrap; }
/* Tab overflow: inactive tabs drop to icon and badge, then what still doesn't fit goes into the ⌄ menu. */
.tabs.compact .ptab:not(.on) .lbl, .tabs.compact .ptab:not(.on) .tech { display: none; }
.tabs.compact .ptab:not(.on) { padding-left: 8px; }
.overflow-btn[hidden] { display: none; }
.overflow-btn { margin-bottom: 4px; gap: 2px; width: auto; padding: 0 4px; font: 600 11px var(--mono); }
.ctoolbar .pick { min-width: 0; } .ctoolbar .pick b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 26ch; }
.reviewing .ctoolbar .agent-pick { display: none; } .reviewing .ctoolbar .pick b { max-width: 16ch; }
.ctoolbar .send, .ctoolbar .agent-pick { flex: none; }
.popover.ci-checks .acts button { white-space: nowrap; }
.note-h b { white-space: nowrap; } .note-h .when { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .note-h .chip { flex: none; }
.mr-foot button, .mr-foot .warn-t { white-space: nowrap; }
@container (max-width: 440px) { .mr-foot .warn-t > span { display: none; } }

/* C: review mode */
.body-row.reviewing .convo { flex: 0 0 380px; border-right: 1px solid var(--line); }
.reviewing .chat { padding: 12px 14px; }
.reviewing .msg.user .bubble { max-width: 100%; }
.reviewing .composer-wrap { padding: 8px 12px 12px; }
.review-surface { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--panel); }
.review-head { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-bottom: 1px solid var(--line); background: var(--bg); font-size: 13px; }
.review-head b { font-weight: 600; }

/* Changes */
.ch-bar { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-bottom: 1px solid var(--line); flex: none; min-width: 0; }
.seg button .n { font: 11px var(--mono); color: var(--muted); }
.seg button.on .n { color: var(--text); }
.base-pick { font-size: 12.5px; }
.ch-body { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
.ch-tree { flex: none; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.tree-head { display: flex; align-items: center; gap: 6px; padding: 4px 10px; font-size: 12px; color: var(--muted); background: none; border: 0; border-radius: 0; width: 100%; text-align: left; }
.tree-head:hover { background: var(--hover); }
.tree-list { max-height: 170px; overflow: auto; padding: 2px 0 6px; }
.ch-tree.collapsed .tree-list { display: none; }
.ch-diffs { flex: 1; min-height: 0; min-width: 0; overflow: auto; padding: 10px; }
.trow { display: flex; align-items: center; gap: 6px; width: 100%; padding: 2px 10px; border: 0; border-radius: 0; background: none; font: 12px var(--mono); text-align: left; color: var(--text); }
.trow:hover { background: var(--panel2); }
.trow.dir { color: var(--muted); cursor: default; } .trow.dir:hover { background: none; }
.trow .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trow svg { width: 13px; height: 13px; color: var(--muted); }
.sdot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--muted); }
.sdot.modified { background: var(--accent); } .sdot.untracked { background: var(--ok); }
.trow .note-n { color: var(--wait); display: inline-flex; gap: 2px; align-items: center; font-size: 11px; }
@container (min-width: 700px) {
  .ch-body { flex-direction: row; }
  .ch-tree { width: 250px; border-bottom: 0; border-right: 1px solid var(--line); }
  .ch-tree .tree-head { display: none; }
  .ch-tree.collapsed .tree-list, .tree-list { display: block; max-height: none; flex: 1; }
}
.df { border: 1px solid var(--line); border-radius: 8px; margin: 0 0 10px; overflow: hidden; background: var(--panel); }
.df-h { display: flex; align-items: center; gap: 8px; padding: 5px 8px; background: var(--panel2); font: 500 12px var(--mono); min-width: 0; position: sticky; top: -10px; z-index: 1; }
.df-h .path { flex: 1; min-width: 0; display: flex; overflow: hidden; white-space: nowrap; }
.df-h .path .dir { color: var(--muted); overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; min-width: 0; }
.df-h .path b { font-weight: 600; flex: none; }
.df-h .icon-btn { width: 20px; height: 20px; }
.df-h .diff-counts { flex: none; }
.df-h .diff-status { flex: none; }
@container (max-width: 420px) { .df-h .diff-status { font-size: 0; padding: 0; width: 7px; height: 7px; border: 0; background: currentColor; } }
.df-skip { padding: 8px 12px; font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.df-skip button { font-size: 12px; padding: 1px 8px; }
.hunk { color: var(--muted); background: color-mix(in srgb, var(--accent) 7%, var(--panel)); font: 11.5px/22px var(--mono); padding: 0 10px; }
.dl { display: grid; grid-template-columns: 36px 40px 14px 1fr; font: 12px/1.7 var(--mono); }
@container (max-width: 420px) { .dl { grid-template-columns: 0 36px 14px 1fr; } .dl .n.o { visibility: hidden; } }
.dl .n { color: var(--muted); text-align: right; padding-right: 6px; user-select: none; position: relative; opacity: .8; }
.dl .m { color: var(--muted); user-select: none; }
.dl .code { white-space: pre-wrap; word-break: break-word; padding-right: 10px; min-width: 0; }
.dl.add { background: color-mix(in srgb, var(--ok) 12%, transparent); } .dl.add .m { color: var(--ok); }
.dl.del { background: color-mix(in srgb, var(--err) 12%, transparent); } .dl.del .m { color: var(--err); }
.dl .addc { display: none; position: absolute; left: 2px; top: 2px; width: 17px; height: 17px; padding: 0; justify-content: center; border-radius: 4px; background: var(--accent); color: var(--accent-text); border: 0; font: 600 13px/1 var(--font); }
.dl:hover .addc { display: inline-flex; }
.tk-k { color: var(--accent); } .tk-s { color: var(--ok); } .tk-c { color: var(--muted); font-style: italic; }
.note { margin: 6px 10px 8px 54px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel2); font: 13px/1.5 var(--font); }
@container (max-width: 420px) { .note { margin-left: 10px; } }
.note.review { border-left: 3px solid var(--wait); }
.note.draft { border-left: 3px solid var(--accent); border-style: dashed solid dashed solid; }
.note-h { display: flex; align-items: center; gap: 6px; padding: 6px 10px 0; font-size: 12px; color: var(--muted); }
.note-h b { color: var(--text); font-weight: 600; }
.note-b { padding: 2px 10px 8px; white-space: normal; }
.note-a { display: flex; gap: 6px; padding: 0 10px 8px; }
.note-a button { font-size: 12px; padding: 2px 8px; }
.note textarea { width: calc(100% - 20px); margin: 8px 10px 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; resize: vertical; outline: none; font: 13px var(--font); }
.note textarea:focus { border-color: var(--accent); }
.flash { animation: flash 1.6s ease-out; }
@keyframes flash { 0%, 30% { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 55%, transparent); } 100% { box-shadow: 0 0 0 3px transparent; } }

/* Merge request */
.mr { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.mr-scroll { flex: 1; min-height: 0; overflow: auto; }
.mr-head { padding: 12px 14px 10px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.mr-head h2 { margin: 0; font-size: 15px; font-weight: 650; line-height: 1.35; }
.mr-meta { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12.5px; color: var(--muted); align-items: center; }
.mr-meta .row { gap: 4px; }
.state-open { color: var(--ok); background: color-mix(in srgb, var(--ok) 15%, transparent); }
.switches { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
@container (max-width: 360px) { .switches { grid-template-columns: 1fr; } }
.switch { display: flex; align-items: flex-start; gap: 9px; padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); text-align: left; cursor: pointer; }
.switch:hover { background: var(--hover); }
.switch .knob { flex: none; margin-top: 3px; width: 28px; height: 16px; border-radius: 8px; background: var(--panel2); border: 1px solid var(--line); position: relative; }
.switch .knob::after { content: ''; position: absolute; top: 2px; left: 2px; width: 10px; height: 10px; border-radius: 50%; background: var(--muted); transition: left .12s; }
.switch[aria-checked="true"] .knob { background: color-mix(in srgb, var(--accent) 40%, transparent); border-color: var(--accent); }
.switch[aria-checked="true"] .knob::after { left: 14px; background: var(--accent); }
.switch .t { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.switch .t b { font-size: 13px; font-weight: 600; }
.switch .t span { font-size: 11.5px; color: var(--muted); line-height: 1.35; }
.mr-tabs { display: flex; gap: 2px; padding: 6px 14px 0; border-bottom: 1px solid var(--line); }
.mr-tabs button { border: 0; border-radius: 0; background: none; color: var(--muted); padding: 5px 8px 7px; font-size: 13px; border-bottom: 2px solid transparent; }
.mr-tabs button.on { color: var(--text); border-bottom-color: var(--accent); }
.sec { padding: 10px 14px; border-bottom: 1px solid var(--line); }
.sec h3 { margin: 0 0 6px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; display: flex; gap: 6px; align-items: center; }
.sec h3 .grow { text-transform: none; letter-spacing: 0; }
.checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }
.checks li { display: grid; grid-template-columns: 16px 1fr auto auto; gap: 8px; align-items: center; font-size: 13px; }
.checks li .why { grid-column: 2 / -1; font: 11.5px var(--mono); color: var(--err); margin-top: -2px; overflow-wrap: anywhere; }
.checks .link, .mr .link, .popover .link { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font: inherit; font-size: 12.5px; }
.checks .link:hover, .mr .link:hover, .popover .link:hover { text-decoration: underline; }
.review-card { border: 1px solid var(--line); border-radius: 8px; background: var(--panel2); margin: 0 0 8px; }
.review-card .rh { display: flex; align-items: center; gap: 6px; padding: 7px 10px 0; font-size: 12.5px; }
.review-card .rb { padding: 3px 10px 8px; font-size: 13px; }
.review-card .quote { margin: 0 10px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--code); overflow: hidden; }
.review-card .quote .qh { font: 11.5px var(--mono); padding: 3px 8px; border-bottom: 1px solid var(--line); display: flex; gap: 6px; align-items: center; }
.review-card .quote .qc { font: 12px/1.6 var(--mono); padding: 2px 8px; white-space: pre-wrap; background: color-mix(in srgb, var(--ok) 12%, transparent); }
.review-card .quote .qt { padding: 6px 8px; font-size: 13px; }
.avatar { width: 20px; height: 20px; border-radius: 50%; display: inline-grid; place-items: center; font: 700 9.5px var(--font); color: #fff; flex: none; }
.tag-changes { color: var(--wait); background: color-mix(in srgb, var(--wait) 15%, transparent); }
.desc h4 { margin: 10px 0 4px; font-size: 13.5px; } .desc h4:first-child { margin-top: 0; }
.desc p, .desc ul { margin: 4px 0; font-size: 13px; } .desc ul { padding-left: 20px; }
.diagram { border: 1px solid var(--line); border-radius: 8px; background: var(--code); padding: 10px; margin: 8px 0; }
.diagram svg { width: 100%; height: auto; display: block; }
.diagram rect { fill: var(--panel2); stroke: var(--line); } .diagram text { fill: var(--text); font: 11px var(--mono); }
.diagram path { stroke: var(--muted); fill: none; } .diagram .head { fill: var(--muted); stroke: none; }
.diagram .cap { font-size: 11px; color: var(--muted); margin-top: 4px; }
.mr-foot { display: flex; gap: 8px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); background: var(--panel); flex: none; }
.mr-foot .warn-t { color: var(--wait); font-size: 12px; display: inline-flex; gap: 4px; align-items: center; }

/* Issue, Terminal */
.issue { flex: 1; overflow: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.issue h2 { margin: 0; font-size: 15px; }
.issue p { margin: 0; font-size: 13px; }
.term { flex: 1; margin: 0; border: 0; border-radius: 0; background: var(--code); padding: 8px 12px; overflow: auto; font: 12.5px/1.55 var(--mono); white-space: pre-wrap; }
.term .p { color: var(--ok); } .term .e { color: var(--err); } .term .m { color: var(--muted); }

/* conversation extras */

function FileDiff(ctx, f) {
  const dir = f.path.includes('/') ? f.path.slice(0, f.path.lastIndexOf('/') + 1) : '';
  const shut = f.generated && !S.ch.expanded[f.path];
  const rows = shut ? `<div class="df-skip">${ic('info', 'sm')}Generated file, ${f.add} lines added. <button data-act="expand" data-f="${f.path}">Show</button></div>`
    : f.hunks.map(h => `<div class="hunk">${h.head}</div>` + h.rows.map(r => {
      const notes = r.n ? NOTES.filter(x => x.file === f.path && x.line === r.n).map(x => Note(x)).join('') + S.drafts.map((d, i) => d.file === f.path && d.line === r.n ? Draft(d, i) : '').join('') : '';
      const drafting = S.drafting && S.drafting.file === f.path && S.drafting.line === r.n && S.drafting.ctx === ctx ? Drafting() : '';
      return `<div class="dl ${r.t === '+' ? 'add' : r.t === '-' ? 'del' : ''}" id="${ctx}-l-${f.path.replace(/[^a-z0-9]/gi, '_')}-${r.n || 'o' + r.o}"><span class="n o">${r.o ?? ''}</span><span class="n">${r.n ?? ''}${r.n ? `<button class="addc" title="Comment on line ${r.n}" data-act="comment" data-ctx="${ctx}" data-f="${f.path}" data-l="${r.n}">+</button>` : ''}</span><span class="m">${r.t === ' ' ? '' : r.t === '-' ? '−' : '+'}</span><span class="code">${hl(r.text)}</span></div>${notes}${drafting}`;
    }).join('')).join('');
  return `<div class="df" id="${fid(ctx, f.path)}"><div class="df-h"><span class="path" title="${f.path}"><span class="dir">${dir}</span><b>${f.path.split('/').pop()}</b></span>
    <span class="diff-status ${f.status}">${STATUS_WORD[f.status]}</span><span class="diff-counts"><span class="add">+${f.add}</span> <span class="del">−${f.del}</span></span></div>${rows}</div>`;
}

// Tab overflow: first the inactive tabs drop to icon and badge; the ones that still don't fit, last first,
// go into the ⌄ menu. The active tab always keeps its label.
function fitTabs() {
  document.querySelectorAll('section.area').forEach(sec => {
    const bar = sec.querySelector('.tabs'); if (!bar) return;
    const fits = () => bar.scrollWidth <= bar.clientWidth + 1;
    if (fits()) return;
    bar.classList.add('compact');
    const inactive = [...bar.querySelectorAll('.ptab:not(.on)')], hidden = [];
    while (!fits() && inactive.length) { const t = inactive.pop(); t.style.display = 'none'; hidden.unshift(t.dataset.id); }
    if (!hidden.length) return;
    const more = sec.querySelector('[data-overflow]');
    more.hidden = false; more.dataset.ids = hidden.join(','); more.querySelector('.n').textContent = hidden.length;
    if (S.pop && S.pop.kind === 'overflow' && S.pop.anchor === more.dataset.anchor) S.pop.ids = more.dataset.ids;
  });
}
function place() {
  const pop = document.getElementById('pop'); if (!pop) return;

  if (S.pop.x != null) { x = S.pop.x; y = S.pop.y; below = y; }
  else {
    const a = document.querySelector(`[data-anchor="${S.pop.anchor}"]`);
    if (!a) { S.pop = null; pop.remove(); return; }
    const r = a.getBoundingClientRect(); x = r.left; y = r.bottom + 4; below = r.top - 4;
    if (S.pop.anchor.startsWith('tm-') || S.pop.anchor === 'more' || S.pop.anchor.startsWith('plus-')) x = r.right - pop.offsetWidth;
  }
  const w = pop.offsetWidth, h = pop.offsetHeight;
  x = clamp(x, 8, innerWidth - w - 8);
  if (y + h > innerHeight - 8) y = Math.max(8, (S.pop.x != null ? y : below) - h);
  pop.style.left = x + 'px'; pop.style.top = y + 'px';
}
let toastT;
function toast(msg, stub = true) { const t = document.getElementById('toast'); t.textContent = msg + (stub ? ' (stub)' : ''); t.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(() => t.style.display = 'none', 1600); }
function gotoNote() { S.ch.seg = 'all'; openPanel('changes'); const ctx = S.review === 'changes' ? 'review' : where('changes'); S.pendingScroll = `[id="${ctx}-l-src_currency_ts-3"] + .note`; }
function send() {
  const v = document.getElementById('msg').value.trim();
  if (!v && !S.drafts.length) return toast('Nothing to send', false);
  const notes = S.drafts.map(d => `<div class="muted" style="font-size:12px;margin-top:4px">${ic('message-square', 'sm')} <span class="tech">${d.file}:${d.line}</span>: ${esc(d.text)}</div>`).join('');
  S.sent.push({ who: 'user', text: esc(v || 'See my comments.') + notes });
  S.drafts = []; document.getElementById('msg').value = '';
  toast('Sent to the agent');
}

// ---------- events ----------
document.addEventListener('click', e => {
  const inPop = e.target.closest('#pop');
  const was = S.pop;
  if (!inPop && S.pop) S.pop = null;
  const el = e.target.closest('[data-act]');
  if (!el) { if (was) render(); return; }
  if (el.dataset.act === 'dialog-close' && e.target.closest('[data-stop]') && !e.target.closest('button')) return;
  const { act, id, v, area, kind, anchor } = el.dataset;
  if (inPop && !['base'].includes(act)) S.pop = null;
  switch (act) {
    case 'pop': if (!(was && was.kind === kind && was.anchor === anchor)) S.pop = { kind, anchor, id, area, ids: el.dataset.ids }; break;
    case 'details': S.pop = { kind: 'details', anchor: document.querySelector('[data-anchor="title"]') ? 'title' : 'more' }; break;
    case 'open': openPanel(id); break;
    case 'open-reviews': S.mr.tab = 'overview'; openPanel('mr'); S.pendingScroll = `[id="${S.review === 'mr' ? 'review' : where('mr')}-reviews"]`; break;
    case 'goto-note': gotoNote(); break;
    case 'toggle-right': if (!S.right.tabs.length && !isNarrow()) { S.right.open = !S.right.open; break; } toggleRight(); break;
    case 'toggle-bottom': S.bottom.open = !S.bottom.open; if (S.bottom.open && !S.bottom.active) S.bottom.active = S.bottom.tabs[0] || null; break;
    case 'tab': S[area].active = id; break;
    case 'section': S.sections[v] = !S.sections[v]; break;
    case 'close': closePanel(id); break;
    case 'move': movePanel(id); break;
    case 'add': if (id === 'term') { const t = 'term' + (++S.terms); S[area].tabs.push(t); S[area].active = t; S[area].open = true; } else openPanel(id, area); break;
    case 'review': S.review = id; S.drawer = false; break;
    case 'unreview': S.review = null; break;
    case 'seg': S.ch.seg = v; break;
    case 'base': S.ch.base = v; S.pop = null; break;
    case 'tree': S.ch.tree = !S.ch.tree; break;
    case 'expand': S.ch.expanded[el.dataset.f] = true; break;
    case 'goto': { const f = FILES.find(x => x.path === el.dataset.f); if (f.generated) S.ch.expanded[f.path] = true; S.pendingScroll = `#${fid(el.dataset.ctx, f.path)}`; break; }
    case 'comment': S.drafting = { ctx: el.dataset.ctx, file: el.dataset.f, line: +el.dataset.l }; break;
    case 'add-draft': { const t = document.getElementById('draft').value.trim(); if (t) S.drafts.push({ file: S.drafting.file, line: S.drafting.line, text: t }); S.drafting = null; break; }
    case 'cancel-draft': S.drafting = null; break;
    case 'rm-draft': S.drafts.splice(+el.dataset.i, 1); break;
    case 'switch': S.mr[v] = !S.mr[v]; toast(`${v === 'watch' ? 'Watch' : 'Auto-prompt'} ${S.mr[v] ? 'on' : 'off'}`, false); break;
    case 'mrtab': S.mr.tab = v; if (v === 'overview' && S.review === 'mr') S.review = null; break;
    case 'merge': S.dialog = 'merge'; break;
    case 'merged': S.dialog = null; toast('Squashed and merged #40'); break;
    case 'dialog': S.dialog = v; break;
    case 'dialog-close': S.dialog = null; break;
    case 'dialog-ok': S.dialog = null; toast(v === 'delete' ? 'Session deleted' : 'Session archived'); break;
    case 'ask-agent': document.getElementById('msg').value = `Please address ${v}.`; toast('Put in the composer', false); return;
    case 'send': send(); break;
    case 'reset': { const t = S.theme; S = INITIAL(); S.theme = t; break; }
    case 'state': S.stateOpen = !S.stateOpen; break;
    case 'stub': e.preventDefault(); toast(v); break;
    default: return;
  }
  render();
});
document.addEventListener('contextmenu', e => {
  const el = e.target.closest('[data-ctx]'); if (!el) return;
  e.preventDefault();
  if (el.dataset.ctx === 'tab') S.pop = { kind: 'tabmenu', id: el.dataset.id, x: e.clientX, y: e.clientY };
  else S.pop = { kind: 'session-menu', x: e.clientX, y: e.clientY };
  render();
});
document.addEventListener('change', e => {
  if (e.target.dataset.pill === 'theme') { S.theme = e.target.value; history.replaceState(null, '', '?theme=' + S.theme); render(); }
  if (e.target.dataset.pill === 'win') { S.winMode = e.target.value; if (!isNarrow()) S.drawer = false; render(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (S.pop) S.pop = null; else if (S.dialog) S.dialog = null; else if (S.drafting) S.drafting = null;
    else if (S.review) S.review = null; else if (isNarrow() && S.drawer) S.drawer = false; else return;
    return render();
  }
  if (e.target.id === 'msg' && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); render(); }
});
document.addEventListener('mousemove', e => {
  const tip = document.getElementById('tip'), el = e.target.closest('[data-tip]');
  if (!el) { tip.style.display = 'none'; return; }
  tip.innerHTML = el.dataset.tip; tip.style.display = 'block';
  const r = tip.getBoundingClientRect();
  tip.style.left = Math.min(e.clientX + 14, innerWidth - r.width - 8) + 'px';
  tip.style.top = Math.min(e.clientY + 16, innerHeight - r.height - 8) + 'px';
});
// Drag an area's edge: the width (or height) belongs to the kind of panel shown (all Terminals share one), not to the area.
document.addEventListener('pointerdown', e => {
  const edge = e.target.closest('[data-edge]'); if (!edge) return;
  const areaName = edge.dataset.edge, A = S[areaName], id = A.active; if (!id) return;
  const box = edge.parentElement, x0 = e.clientX, y0 = e.clientY;
  const w0 = box.offsetWidth, h0 = box.offsetHeight, tag = box.querySelector('.size-tag');
  e.preventDefault(); document.body.classList.add(areaName === 'right' ? 'resizing' : 'resizing-rows');
  let last = areaName === 'right' ? w0 : h0;
  const move = ev => {
    if (areaName === 'right') { const max = isNarrow() ? Math.floor(mainW() * .94) : mainW() - 340; last = clamp(w0 + (x0 - ev.clientX), KINDS[kindOf(id)].min, max); box.style.width = last + 'px'; }
    else { last = clamp(h0 + (y0 - ev.clientY), 120, Math.floor(innerHeight * .6)); box.style.height = last + 'px'; }
    if (tag) tag.textContent = last + 'px';
  };
  const up = () => { removeEventListener('pointermove', move); removeEventListener('pointerup', up); document.body.classList.remove('resizing', 'resizing-rows'); (areaName === 'right' ? S.size : S.height)[kindOf(id)] = last; render(); };
  addEventListener('pointermove', move); addEventListener('pointerup', up);
});
let wasNarrow = isNarrow();
addEventListener('resize', () => { const n = isNarrow(); if (n !== wasNarrow) { S.drawer = false; wasNarrow = n; } render(); });
render();
</script>
