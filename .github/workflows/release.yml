name: Release

# A vX.Y.Z tag on main publishes that version to GitHub Releases, where
# electron-updater finds it. Only plain X.Y.Z tags: Loom offers stable
# releases only, so there are no prerelease tags to publish.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  version:
    name: Check the version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The bridge and the app are stamped with apps/client/package.json's
      # version, and electron-updater compares releases by it.
      - name: The tag names the Client's version
        run: |
          version=$(node -p "require('./apps/client/package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag $GITHUB_REF_NAME doesn't match apps/client/package.json's version $version."
            exit 1
          fi

  package:
    needs: version
    uses: ./.github/workflows/package.yml
    with:
      upload: true

  publish:
    name: Publish
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "Loom ${GITHUB_REF_NAME#v}" --generate-notes --latest
